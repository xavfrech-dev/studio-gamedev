<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio</title>
<!-- Studio gamedev : page générique (aucune dépendance externe).
     Servie par serveur_studio.py --projet <dossier> : lit <projet>/.studio/ (studio.config.json, profil.json,
     roadmap.json, progression/, decisions.json…) et écrit par l'API locale. Contrat : references/studio.md. -->
<link rel="stylesheet" href="roadmap.css">
<style>
:root{
  --nuit:#1a1713;--nuit2:#241f19;--bord:rgba(233,210,160,.16);
  --papier:#f4ecd9;--encre:#2b241c;--encre2:#5c4f3f;--encre3:#8a7b66;
  --ocre:#b98532;--ocre2:#e2b866;--sapin:#3f7a52;--rouge:#a8432e;--bleu:#4d6f9c;
  --sans:"Jeu Interface","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --serif:"Jeu Texte",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#1a1713}
body{color:#efe6d2;font:14px var(--sans);-webkit-font-smoothing:antialiased;background:radial-gradient(1400px 800px at 50% 25%,#2d261e 0%,#1a1713 65%) fixed}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ocre2);outline-offset:2px}

/* ---------- en-tête ---------- */
#entete{position:fixed;inset:0 0 auto 0;z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;background:linear-gradient(180deg,rgba(26,23,19,.95),rgba(26,23,19,.6) 80%,transparent)}
#entete h1{margin:0 auto 0 0;font:400 22px/1.1 var(--serif);letter-spacing:.08em;color:#f1d9a4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
#entete h1 i{font:italic 13px var(--serif);letter-spacing:.02em;color:#cdbb98;margin-left:8px}
.outils{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bt{display:inline-flex;align-items:center;gap:7px;min-height:38px;background:linear-gradient(180deg,rgba(255,250,235,.07),rgba(255,250,235,.02));border:1px solid var(--bord);border-radius:999px;padding:6px 14px;color:#eadfc8;white-space:nowrap;position:relative}
.bt:hover{background:rgba(233,196,127,.10);border-color:rgba(233,196,127,.45)}
.bt svg{width:17px;height:17px;flex:none;color:#e2b866}
.bt.fort{background:linear-gradient(180deg,#d8a650,#b98532);border-color:#d8a650;color:#231b12;font-weight:600}
.bt.fort svg{color:inherit}
.bt .pastille{background:var(--rouge);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;line-height:17px;font-weight:600}
.bt .pastille:empty{display:none}
.bt.sonne svg{animation:sonne 1s ease-in-out infinite}
@keyframes sonne{0%,100%{transform:rotate(0)}20%{transform:rotate(14deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}}
#niveau{display:flex;flex-direction:column;gap:3px;min-width:150px;padding:6px 14px;border:1px solid var(--bord);border-radius:14px;background:rgba(255,250,235,.05);color:#e8dcc2;font:13px var(--serif);cursor:pointer;text-align:left}
#niveau b{color:#f1d9a4;font-size:17px}
#niveau .rang{font-style:italic;color:#e2b866}
#niveau .xpm{height:7px;border-radius:3px;background:#3a3128;overflow:hidden}
#niveau .xpm i{display:block;height:100%;width:0;background:linear-gradient(90deg,#c9953e,#f1d9a4);transition:width .8s}

/* ---------- bureau ---------- */
#bureau{position:fixed;inset:0;display:block;width:100%;height:100%;cursor:default}
#bureau.survol{cursor:pointer}
body.questionnaire #indice{display:none}
#indice{position:fixed;left:16px;bottom:12px;z-index:5;font:12px var(--sans);color:#bfb196;pointer-events:none}

/* ---------- notifications ---------- */
#notifs{position:fixed;right:16px;top:64px;z-index:36;width:min(380px,92vw);max-height:70vh;overflow:auto;color:var(--encre);border-radius:6px 12px 12px 12px;padding:12px 14px;background:linear-gradient(180deg,#fbf5e6,#efe3c7);box-shadow:0 18px 40px rgba(0,0,0,.5);border:1px solid rgba(185,133,50,.35)}
#notifs h2{font:italic 400 19px var(--serif);margin:0 0 6px;display:flex;justify-content:space-between;align-items:center}
#notifs h2 button{font:12px var(--sans);background:none;border:0;color:var(--ocre);text-decoration:underline}
.notif{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-bottom:1px dotted rgba(92,79,63,.3);padding:8px 4px;color:var(--encre)}
.notif:hover{background:rgba(185,133,50,.1)}
.notif .ni{width:24px;height:24px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#e9dcc0;font-size:12px}
.notif.t-succes .ni,.notif.t-fait .ni{background:#d9ead9;color:#2f6b3f}.notif.t-decision .ni{background:#f6e2b8;color:#8a5b12}.notif.t-alerte .ni{background:#f2d4cb;color:#93351f}
.notif .nt{flex:1;min-width:0}.notif .nt b{display:block;font:400 14px var(--serif)}.notif .nt small{display:block;color:var(--encre2);font-size:12px}
.notif time{font:11px Consolas,monospace;color:var(--ocre)}
.notif.nonlue .nt b{font-weight:700}
.vide{color:var(--encre3);font-style:italic;padding:8px 0}
#toasts{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;max-width:min(380px,90vw);background:linear-gradient(180deg,#3a3128,#2a241d);border:1px solid rgba(226,184,102,.45);border-radius:10px;padding:9px 14px;color:#f4ecd9;box-shadow:0 10px 26px rgba(0,0,0,.45);transition:opacity .4s,transform .4s}
.toast.erreur{border-color:#c2533c}
.toast.part{opacity:0;transform:translateY(8px)}
.toast button{background:none;border:0;color:#e2b866;text-decoration:underline;padding:0 0 0 8px}

/* ---------- panneau central (file unique) ---------- */
#panneau{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;background:rgba(15,12,9,.55);opacity:0;pointer-events:none;transition:opacity .25s}
#panneau.vu{opacity:1;pointer-events:auto}
#panneau .feuille{position:relative;width:min(640px,94vw);max-height:86vh;overflow:auto;color:var(--encre);border-radius:8px 16px 16px 8px;padding:22px 26px 24px;background:radial-gradient(120% 90% at 30% 0%,#fbf6e8 0%,#f2e8cf 55%,#e8d9b6 100%);box-shadow:0 24px 60px rgba(0,0,0,.55);transform:translateY(10px);transition:transform .25s}
#panneau.vu .feuille{transform:none}
#panneau .x{position:sticky;top:0;float:right;width:34px;height:34px;border-radius:50%;border:1px solid rgba(43,36,28,.2);background:rgba(255,250,238,.9);font-size:20px;line-height:1;margin:-8px -10px 0 8px}
#panneau .file{font:12px var(--sans);color:var(--encre3);margin:0 0 4px}
.surtitre{font:600 10.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ocre)}
.feuille h2{font:400 26px/1.15 var(--serif);margin:3px 0 8px}
.feuille h3{font:italic 400 17px var(--serif);color:#7a5a2a;margin:18px 0 6px}
.feuille p{line-height:1.5}
.discret{color:var(--encre3);font-size:12.5px}
.rangee{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.bts{border:1px solid rgba(92,79,63,.3);background:#fffdf6;border-radius:999px;padding:7px 14px;color:var(--encre)}
.bts:hover{border-color:var(--ocre)}
.btp{border:1px solid #c9953e;background:linear-gradient(180deg,#e2b866,#c9953e);border-radius:999px;padding:7px 16px;color:#231b12;font-weight:600}
.btp:disabled{opacity:.5;cursor:default}
.feuille textarea,.feuille input[type=text]{width:100%;border:1px solid rgba(92,79,63,.3);border-radius:8px;padding:8px 10px;background:#fffdf6;color:var(--encre)}
.feuille textarea{min-height:76px;resize:vertical}
.barre{position:relative;height:20px;border-radius:7px;background:#e3d4b2;box-shadow:inset 0 1px 3px rgba(80,60,30,.3);overflow:hidden;margin:6px 0}
.barre i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#c9953e,#6fa75c)}
.barre span{position:relative;display:block;text-align:center;font:600 12px/20px var(--sans)}
.etapes{margin:6px 0 0;padding-left:22px}.etapes li{margin:3px 0}
.choix-dec{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.choix-dec button{text-align:left}
.choix-dec button.rec{border-color:#c9953e;box-shadow:0 0 0 2px rgba(226,184,102,.4)}
.micro.actif{background:#c2533c;color:#fff;border-color:#c2533c}
/* panneau plein cadre (rapport, mur d'images) */
#panneau.large .feuille{width:min(1180px,96vw);max-height:92vh;padding:24px 30px 26px}
/* recrutement */
.form-rec{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:10px}
.form-rec .champ{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--encre2)}
.form-rec .plein{grid-column:1/-1}
.form-rec select,.form-rec input[type=color]{border:1px solid rgba(92,79,63,.3);border-radius:6px;background:#fffdf6;padding:4px 6px;color:var(--encre);min-height:34px}
.form-rec .coche{flex-direction:row;align-items:center;gap:8px}
.form-rec .ligne-champ{display:flex;gap:8px;align-items:flex-start}.form-rec .ligne-champ>:first-child{flex:1}
#rc-res.erreur{color:var(--rouge);font-weight:600}
/* mur d'images */
.mur{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:12px}
.mur button{display:flex;flex-direction:column;gap:4px;padding:6px;border:1px solid rgba(92,79,63,.25);border-radius:8px;background:#fffdf6;text-align:left;color:var(--encre)}
.mur button:hover{border-color:var(--ocre);transform:translateY(-1px)}
.mur img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:5px;background:#e9dcbc}
.mur b{font:400 14px/1.2 var(--serif)}.mur small{font-size:11.5px;color:var(--encre3)}
.cadre{display:flex;flex-direction:column;gap:8px;align-items:center}
.cadre img{max-width:100%;max-height:72vh;object-fit:contain;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.3);background:#2b241c}
/* rapport de l'assistant */
.rapport-tete{display:flex;gap:16px;align-items:center}
.rapport-tete canvas{width:92px;height:92px;flex:none;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fffaf0,#e9dcbc);box-shadow:0 0 0 3px #e2b866}
.rapport-tete .bulle{font:italic 16px/1.45 var(--serif);color:var(--encre)}
.tab-rapport{width:100%;border-collapse:collapse;margin:8px 0;font-size:14px}
.tab-rapport th{text-align:left;font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--encre3);padding:6px 6px;border-bottom:1px solid rgba(92,79,63,.3)}
.tab-rapport td{padding:7px 6px;border-bottom:1px dotted rgba(92,79,63,.25);vertical-align:middle}
.tab-rapport .barre{margin:0;height:16px}.tab-rapport .barre span{line-height:16px;font-size:11px}
.liste-ok{list-style:none;padding:0;margin:4px 0}.liste-ok li{padding:3px 0}.liste-ok li::before{content:"✓ ";color:var(--sapin);font-weight:700}
.liste-dec{display:flex;flex-direction:column;gap:6px;margin:6px 0}.liste-dec button{text-align:left}
@media (max-width:640px){.form-rec{grid-template-columns:1fr}.mur{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}}

/* ---------- bandeau des succès (file) ---------- */
#succes{position:fixed;left:50%;top:14px;transform:translate(-50%,-150%);z-index:70;min-width:min(520px,92vw);display:flex;align-items:center;gap:16px;padding:12px 26px 12px 14px;border-radius:14px;cursor:pointer;background:linear-gradient(180deg,#3a3128,#241f19);border:2px solid #e2b866;color:#f4ecd9;box-shadow:0 16px 40px rgba(0,0,0,.55);transition:transform .55s cubic-bezier(.2,1.4,.3,1)}
#succes.vu{transform:translate(-50%,0)}
#succes .si{width:54px;height:54px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden;background:radial-gradient(circle at 35% 30%,#fff7dc,#e2b866);box-shadow:inset 0 -3px 0 rgba(0,0,0,.15),0 0 0 3px #8a5b12;color:#2b241c}
#succes .si img{width:46px;height:46px;object-fit:contain}
#succes b{display:block;font:700 19px var(--serif);letter-spacing:.03em;color:#f1d9a4}
#succes small{display:block;font:14.5px var(--serif)}
#succes .sur{font:600 11px var(--sans);letter-spacing:.18em;text-transform:uppercase;opacity:.75}

/* ---------- scène du questionnaire (mode accueil) ---------- */
#scene{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:30;width:min(980px,100vw);max-height:56vh;display:flex;flex-direction:column;color:var(--encre);border-radius:16px 16px 0 0;background:radial-gradient(120% 90% at 30% 0%,#fbf6e8 0%,#f2e8cf 55%,#e8d9b6 100%);box-shadow:0 -14px 50px rgba(0,0,0,.55);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#scene.parti{transform:translate(-50%,110%)}
#chapitres{display:flex;gap:4px;padding:10px 18px 0;flex-wrap:wrap}
#chapitres span{flex:1;min-width:56px;height:24px;border-radius:5px;background:rgba(92,79,63,.12);font:600 10.5px/24px var(--sans);text-align:center;color:var(--encre3);letter-spacing:.04em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 4px}
#chapitres span.fini{background:#d9ead9;color:#2f6b3f}
#chapitres span.cours{background:#f6e2b8;color:#8a5b12;box-shadow:0 0 0 2px var(--ocre)}
#sc-corps{overflow:auto;padding:12px 22px 18px}
.sc-tete{display:flex;gap:14px;align-items:flex-start}
#sc-avatar{width:84px;height:84px;flex:none;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fffaf0,#e9dcbc);box-shadow:0 0 0 3px #e2b866,0 6px 14px rgba(80,60,30,.25)}
.bulle{position:relative;flex:1;background:#fffdf6;border:1px solid rgba(92,79,63,.22);border-radius:4px 16px 16px 16px;padding:10px 14px;box-shadow:0 3px 10px rgba(80,60,30,.12)}
.bulle .qui{font:600 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ocre)}
.bulle h2{font:400 22px/1.25 var(--serif);margin:2px 0 4px}
.bulle p{margin:0;color:var(--encre2);font-size:13.5px}
.bulle .msg{margin:0 0 6px;font:italic 15px var(--serif);color:var(--sapin)}
.cartes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0 6px}
.carte{position:relative;display:flex;flex-direction:column;align-items:stretch;text-align:left;padding:8px 8px 10px;border-radius:8px;border:1px solid rgba(92,79,63,.25);background:#fffdf6;color:var(--encre);transition:transform .12s,box-shadow .12s}
.carte:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(80,60,30,.18)}
.carte img{width:100%;aspect-ratio:4/3;object-fit:contain;border-radius:5px;background:#f6efdc}
.carte b{font:400 15.5px/1.2 var(--serif);margin-top:6px}
.carte small{font-size:12px;color:var(--encre2);margin-top:2px}
.carte.rec{border:2px solid #c9953e;box-shadow:0 0 0 3px rgba(226,184,102,.35),0 6px 16px rgba(185,133,50,.25);background:linear-gradient(180deg,#fffaf0,#fbefd2)}
.carte.rec::after{content:"★ " attr(data-rec);position:absolute;top:-9px;right:8px;background:#c9953e;color:#231b12;font:700 10.5px/18px var(--sans);letter-spacing:.06em;border-radius:9px;padding:0 8px;text-transform:uppercase}
.carte.choisie{outline:3px solid var(--sapin);outline-offset:1px;background:#eef6ea}
.carte.choisie::before{content:"✓";position:absolute;top:6px;left:8px;width:24px;height:24px;border-radius:50%;background:var(--sapin);color:#fff;font:700 14px/24px var(--sans);text-align:center}
.sc-libre{display:flex;gap:8px;align-items:stretch;margin-top:10px}
.sc-libre input,.sc-libre textarea{flex:1;border:1px solid rgba(92,79,63,.3);border-radius:8px;padding:9px 11px;background:#fffdf6;color:var(--encre);font-size:15px}
.sc-libre textarea{min-height:84px;resize:vertical}
.sc-bas{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.sc-bas .espace{flex:1}
.puces{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.puces button{border:1px dashed rgba(92,79,63,.45);background:#fffaf0;border-radius:999px;padding:4px 12px;color:var(--encre)}
.attente{display:flex;gap:10px;align-items:center;font:italic 16px var(--serif);color:var(--encre2);margin:16px 0}
.plume{width:14px;height:14px;border-radius:50%;background:var(--ocre);animation:pulse 1.2s ease-in-out infinite;flex:none}
@keyframes pulse{0%,100%{transform:scale(.6);opacity:.4}50%{transform:scale(1);opacity:1}}
.recap{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px}
.recap th{text-align:left;font:italic 15px var(--serif);color:#7a5a2a;padding:10px 4px 4px;border-bottom:1px solid rgba(92,79,63,.25)}
.recap td{padding:4px;border-bottom:1px dotted rgba(92,79,63,.22);vertical-align:top}
.recap tr.ligne{cursor:pointer}.recap tr.ligne:hover td{background:rgba(185,133,50,.1)}
.recap .src{width:22px;text-align:center;font-weight:700}
.src-utilisateur{color:var(--sapin)}.src-deduit{color:var(--bleu)}.src-a_confirmer,.src-voix_a_interpreter{color:var(--rouge)}
.perso-ed{display:grid;grid-template-columns:130px 1fr;gap:14px;align-items:start;margin-top:10px}
.perso-ed>div{display:grid;grid-template-columns:1fr 1fr;column-gap:18px}.perso-ed>div>.rangee{grid-column:1/-1}
.perso-ed canvas{width:130px;height:130px;border-radius:12px;background:radial-gradient(circle at 40% 35%,#fffaf0,#e9dcbc)}
.perso-ed label{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:3px 0;font-size:13px}
.perso-ed select{border:1px solid rgba(92,79,63,.3);border-radius:6px;background:#fffdf6;padding:3px 6px;color:var(--encre)}
.annule{margin-top:10px;padding:8px 12px;border-radius:8px;background:#eef6ea;border:1px solid rgba(63,122,82,.4);font-size:13.5px}
.curseur{display:flex;gap:12px;align-items:center;margin:14px 0}.curseur input{flex:1;accent-color:#b98532}.curseur output{font:600 20px var(--serif);min-width:70px;text-align:right}
@media (max-width:640px){.perso-ed>div{grid-template-columns:1fr}#entete h1{max-width:60vw;font-size:18px}#niveau{min-width:0}.cartes{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}#sc-avatar{width:56px;height:56px}.bulle h2{font-size:18px}.perso-ed{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){#scene,#succes,#panneau,.carte{transition:none}.plume{animation:none}}
</style>
</head>
<body>
<canvas id="bureau" aria-label="Le bureau du studio"></canvas>
<header id="entete">
  <h1 id="nom">Studio</h1>
  <button type="button" id="niveau" title="Niveau du studio" hidden><span><span id="niv-t">niv.</span> <b id="niv-n">1</b> · <span class="rang" id="niv-rang"></span></span><span class="xpm"><i id="niv-xp"></i></span></button>
  <nav class="outils" aria-label="Outils">
    <button type="button" class="bt" id="bt-decisions" hidden><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 11V7a4 4 0 0 1 8 0v4l1.5 1.5h-11z"/><path d="M6.5 14a1.5 1.5 0 0 0 3 0"/></svg><span data-t="decisions">Décisions</span> <span class="pastille" id="nb-decisions"></span></button>
    <button type="button" class="bt" id="bt-notifs" aria-haspopup="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2" y="3" width="12" height="9" rx="1.5"/><path d="M2.5 4l5.5 4 5.5-4"/></svg><span data-t="notifs">Notifications</span> <span class="pastille" id="nb-notifs"></span></button>
    <button type="button" class="bt" id="bt-rapport" hidden><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="1.5" width="10" height="13" rx="1.5"/><path d="M5.5 5h5M5.5 8h5M5.5 11h3"/></svg><span data-t="rapport">Rapport</span></button>
    <button type="button" class="bt" id="bt-images" hidden><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><circle cx="5.5" cy="6" r="1.3"/><path d="M2 12l4-4 3 3 2-2 3.5 3.5"/></svg><span data-t="images">Images</span> <span class="pastille" id="nb-images"></span></button>

let ANALYSE = undefined;   // adoption : analyse_projet.json lu une fois ; ses déductions passent avant celles de deductions.json

const avecProjet = d => { DED_SIG = JSON.stringify(d); const a = REP.mode === 'adoption' && ANALYSE && ANALYSE.deductions; if (!d || !a) return d; const fx = {}, rc = {};
  for (const [k, v] of Object.entries(a.sures || {})) if (v && 'valeur' in v) fx[k] = { valeur: v.valeur, raison: v.raison };
  for (const [k, v] of Object.entries(a.probables || {})) if (v && 'valeur' in v) rc[k] = v.valeur;
  return Object.assign({}, d, { fixes: Object.assign({}, d.fixes || {}, fx), recommandes: Object.assign({}, d.recommandes || {}, rc) }); };
let CONF = {}, PROFIL = {}, QF = null, REP = { reponses: {} }, DED = null, SUIVI = null, ETAT = null, RM_C = null;

async function lire(nom) {
  try { const r = await fetch(nom + (nom.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store' }); if (!r.ok) return null; return await r.json(); }
  catch (e) { return null; }
}
async function poster(route, corps) {
  const r = await fetch(route, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corps) });
  const j = await r.json().catch(() => null);
  if (!r.ok || !j || j.ok === false) throw new Error((j && j.erreur) || ('HTTP ' + r.status));

}

let RECRUES = [], IMAGES = [], RAPPORT = null;
const FICHES_RECRUES = {};
const NB_BUREAUX = 12;
// Postes de la config (9 au plus), puis recrues (recrues/<nom>.json) : 12 bureaux en tout.
const postes = () => {
  const base = (Array.isArray(CONF.postes) ? CONF.postes : []).filter(p => p && typeof p.id === 'string').slice(0, 9), ids = new Set(base.map(p => p.id));
  const rec = RECRUES.filter(r => r && typeof r.nom === 'string' && !ids.has(r.nom)).map(r => ({ id: r.nom, nom: r.nom_affiche || r.nom, role: r.role || '', mission: r.mission || '', couleur: r.couleur, apparence: r.apparence, skills: Array.isArray(r.skills) ? r.skills : [], genre: 'recrue' }));
  return base.concat(rec).slice(0, NB_BUREAUX);
};
const nomPoste = p => String(p.nom || p.id);
const nomAssistant = () => (PROFIL.assistant && PROFIL.assistant.nom) || t('assistant');

async function chargerTout() {
  const conf = await lire('studio.config.json'); if (conf) CONF = conf;
  const lg = String(CONF.langue || (PROFIL.maitre && PROFIL.maitre.langue) || document.documentElement.lang || 'fr').slice(0, 2);
  if (lg !== LANGUE || !QF) { LANGUE = TXT[lg] ? lg : 'en'; document.documentElement.lang = lg; traduirePage(); }
  const [prof, etat, st, dec, rdec, rass, ded, sui, idx, rap] = await Promise.all(['profil.json', 'etat.json', 'demandes/statuts.json', 'decisions.json', 'reponses.json', 'reponses_assistant.json', 'deductions.json', 'questions_suivi.json', 'recrues/index.json', 'rapport_assistant.json'].map(lire));
  if (prof) { PROFIL = prof; for (const k of ['maitre', 'assistant']) if (PROFIL[k] && /\{\{/.test(String(PROFIL[k].nom || ''))) PROFIL[k].nom = ''; } ETAT = etat; STATUTS = st || {}; DECISIONS = Array.isArray(dec) ? dec : []; REPONSES_DEC = Array.isArray(rdec) ? rdec : [];
  if (ANALYSE === undefined) ANALYSE = await lire('analyse_projet.json');   // null hors adoption (une seule lecture)
  if (ded) DED = avecProjet(ded); if (sui) SUIVI = sui;
  // recrues : index tenu par le serveur, fiches lues une fois (puis à chaque changement de l'index)
  const noms = (Array.isArray(idx) ? idx : []).filter(n => typeof n === 'string' && /^[a-z0-9][a-z0-9-]{2,39}$/.test(n)).slice(-NB_BUREAUX);
  await Promise.all(noms.filter(n => !FICHES_RECRUES[n]).map(async n => { const f = await lire('recrues/' + n + '.json'); if (f && f.nom === n) FICHES_RECRUES[n] = f; }));
  const avant = new Set(RECRUES.map(r => r.nom)); RECRUES = noms.map(n => FICHES_RECRUES[n]).filter(Boolean);
  if (CHARGE_UNE_FOIS) RECRUES.filter(r => !avant.has(r.nom)).forEach(r => Bureau.arrivee(r.nom));

  if (rap && typeof rap === 'object') RAPPORT = rap;
  CHARGE_UNE_FOIS = true;

  if (Array.isArray(rass)) lireReponsesAssistant(rass);
  majEntete(); verifierDecisions(); verifierPostes(); Quest.suivis(); majOutils(); verifierRapport();
}

}

// ====================================================================== son (synthétisé, coupé sur demande)
const Son = (() => {
  let ctx = null, coupe = LS.get('son_coupe', false);
  function bip(f, d, o = {}) {
    if (coupe) return;
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      const at = ctx.currentTime + (o.at || 0), osc = ctx.createOscillator(), g = ctx.createGain();
      osc.type = o.type || 'sine'; osc.frequency.value = f;
      g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(o.gain || .04, at + .01); g.gain.exponentialRampToValueAtTime(.0001, at + d);
      osc.connect(g).connect(ctx.destination); osc.start(at); osc.stop(at + d + .05);
    } catch (e) { /* audio indisponible */ }
  }
  return {
    clic() { bip(880, .05, { gain: .02, type: 'triangle' }); },
    cloche() { [1318, 1760].forEach((f, i) => bip(f, 1.2, { gain: .035, at: i * .18 })); },
    construit() { [392, 523, 659].forEach((f, i) => bip(f, .25, { type: 'triangle', gain: .03, at: i * .07 })); },
    succes(taille) {
      const notes = taille === 'grand' ? [523, 659, 784, 1046, 1318, 1568] : taille === 'moyen' ? [587, 740, 880, 1175] : [659, 880, 1175];
      notes.forEach((f, i) => { bip(f, .22 + (i === notes.length - 1 ? .35 : 0), { type: 'triangle', gain: .05, at: i * .075 }); bip(f * 2, .12, { gain: .012, at: i * .075 + .01 }); });
      if (taille !== 'petit') bip(notes[notes.length - 1] * 1.5, .6, { gain: .02, at: notes.length * .075 });
    },
    fichier(son) { if (coupe || !cheminSur(son, /\.(ogg|mp3|wav)$/i)) return; try { const a = new Audio(son); a.volume = .6; a.play().catch(() => {}); } catch (e) { /* rien */ } },
    basculer() { coupe = !coupe; LS.set('son_coupe', coupe); return !coupe; },
    coupe: () => coupe
  };
})();

// ====================================================================== toasts et notifications
function toast(html, o = {}) {
  const el = document.createElement('div'); el.className = 'toast' + (o.erreur ? ' erreur' : ''); el.innerHTML = html;
  if (o.action) { const b = document.createElement('button'); b.textContent = o.action.libelle; b.onclick = () => { o.action.f(); fin(); }; el.appendChild(b); }
  $('#toasts').appendChild(el);
  const fin = () => { el.classList.add('part'); setTimeout(() => el.remove(), 450); };
  setTimeout(fin, o.duree || 5000); return { fermer: fin, el };
}
const Notifs = (() => {
  let liste = LS.get('notifs', []);
  const ICONES = { succes: '★', fait: '✓', decision: '?', alerte: '!', info: 'i' };
  function sauver() { liste = liste.slice(-80); LS.set('notifs', liste); majPastille(); }
  function majPastille() { const n = liste.filter(x => !x.lu).length; $('#nb-notifs').textContent = n ? String(n) : ''; }
  function ajouter(n, silencieux) {
    if (liste.some(x => x.id === n.id)) return;
    liste.push(Object.assign({ t: Date.now(), lu: false, type: 'info' }, n)); sauver();
    if (!$('#notifs').hidden) rendre();
    if (!silencieux && n.type !== 'succes') toast('<b>' + esc(n.titre) + '</b>' + (n.ligne ? '<br>' + esc(n.ligne) : ''));
  }
  function rendre() {
    const el = $('#notifs'), l = liste.slice().reverse();
    el.innerHTML = `<h2>${esc(t('notifs'))}<button type="button" id="nt-lu">${esc(t('tout_lu'))}</button></h2>` +
      (l.length ? l.map(n => `<button type="button" class="notif t-${esc(n.type)}${n.lu ? '' : ' nonlue'}" data-id="${esc(n.id)}"><span class="ni">${esc(ICONES[n.type] || 'i')}</span><span class="nt"><b>${esc(n.titre)}</b>${n.ligne ? `<small>${esc(n.ligne)}</small>` : ''}</span><time>${esc(new Date(n.t).toLocaleTimeString(LANGUE, { hour: '2-digit', minute: '2-digit' }))}</time></button>`).join('') : `<p class="vide">${esc(t('aucune_notif'))}</p>`);
    el.querySelector('#nt-lu').onclick = () => { liste.forEach(x => x.lu = true); sauver(); rendre(); };
    el.querySelectorAll('.notif').forEach(b => b.onclick = () => { const n = liste.find(x => x.id === b.dataset.id); if (!n) return; n.lu = true; sauver(); el.hidden = true; agir(n.cible); });
  }
  function agir(c) {
    if (!c) return;
    if (c.poste) { const p = postes().find(x => x.id === c.poste); if (p) ficheposte(p); }
    else if (c.decision) { const d = DECISIONS.find(x => x.id === c.decision); if (d) ouvrirDecision(d); }
    else if (c.roadmap && window.Roadmap) Roadmap.ouvrir();
  }
  majPastille();
  return { ajouter, rendre, basculer() { const el = $('#notifs'); el.hidden = !el.hidden; if (!el.hidden) rendre(); } };
})();

// ====================================================================== panneau central : un seul document à la fois, le reste en file
const Panneau = (() => {
  const FILE = []; let ouvert = null;
  const el = $('#panneau'), corps = $('#pn-corps');
  // o.large : plein cadre (rapport de l'assistant, mur d'images)
  function montrer(cle, rendu, o = {}) {
    if (ouvert) { if (ouvert !== cle && !FILE.some(x => x.cle === cle)) FILE.push({ cle, rendu, o }); majFile(); return; }
    ouvert = cle; corps.innerHTML = ''; el.classList.toggle('large', !!o.large); try { rendu(corps); } catch (e) { erreur('panneau', e); }
    majFile(); el.classList.add('vu'); const f = corps.querySelector('textarea,input,button'); if (f) setTimeout(() => f.focus(), 60);
  }
  function majFile() { let f = corps.querySelector('.file'); if (FILE.length) { if (!f) { f = document.createElement('p'); f.className = 'file'; corps.prepend(f); } f.textContent = `${FILE.length} ${t('a_suivre')}`; } else if (f) f.remove(); }
  function fermer() { if (!ouvert) return; ouvert = null; el.classList.remove('vu'); Voix.arreter(); setTimeout(() => { const n = FILE.shift(); if (n) montrer(n.cle, n.rendu, n.o); }, 420); }
  el.querySelector('.x').onclick = fermer;
  el.addEventListener('click', e => { if (e.target === el) fermer(); });
  return { montrer, fermer, ouvert: () => ouvert };
})();

const Succes = (() => {

  let courant = null, dernierQF = null, pile = [], suivisFile = [], retourRecap = false, attente = null, annulation = null, choixMulti = new Set();
  const scene = $('#scene'), corps = $('#sc-corps');
  const R = () => REP.reponses;
  const val = id => R()[id] ? R()[id].valeur : undefined;
  const mode = () => REP.mode || (val('accueil.mode') === 'complet' ? 'complet' : 'rapide');
  function cond(si) {
    if (!si) return true;
    return Object.entries(si).every(([cle, c]) => {
      const v = val(cle), a = v === undefined || v === null;
      if ('egal' in c) return !a && (Array.isArray(v) ? v.includes(c.egal) : v === c.egal);
      if ('different_de' in c) return a || (Array.isArray(v) ? !v.includes(c.different_de) : v !== c.different_de);
      if ('dans' in c) return !a && (Array.isArray(v) ? v.some(x => c.dans.includes(x)) : c.dans.includes(v));
      if ('existe' in c) return c.existe ? !a : a;
      return true;
    });
  }
  const fixe = q => (DED && DED.fixes && DED.fixes[q.id]) || (REP.mode === 'adoption' && (R()[q.id] || {}).via === 'analyse');
  function incluse(q) {
    if (q.chapitre !== 'fin' && (mode() === 'complet' ? q.seulement_rapide : !q.rapide)) return false;   // adoption : comme rapide, moins ce qui est déduit du projet
    if (!cond(q.si)) return false;
    if (fixe(q)) return false;
    return true;
  }
  const liste = () => QF.questions.filter(incluse);
  const qDe = id => QF.questions.find(q => q.id === id) || (SUIVI && (SUIVI.questions || []).find(q => q.id === id));
  const rec = q => { const r = DED && DED.recommandes && DED.recommandes[q.id]; return r !== undefined && r !== null ? r : q.recommande; };
  const chapTitre = id => ((QF.chapitres || []).find(c => c.id === id) || {}).titre || id;
  function chapitresFinis() { return Array.isArray(REP.chapitres_finis) ? REP.chapitres_finis : []; }

  // ---- enregistrement d'une réponse
  async function noter(q, valeur, o = {}) {
    const r = { valeur, source: o.source || 'utilisateur', via: o.via || 'clic', t: new Date().toISOString() };
    if (o.texte_brut) r.texte_brut = o.texte_brut;
    R()[q.id] = r;
    const envoi = { cle: q.id, valeur, source: r.source, via: r.via, chapitre_courant: q.chapitre || (courant && courant.chapitre) || '', langue: LANGUE };
    if (o.texte_brut) envoi.texte_brut = o.texte_brut.slice(0, 4000);
    if (q.id === 'accueil.mode' && (valeur === 'rapide' || valeur === 'complet')) { REP.mode = valeur; envoi.mode = valeur; }
    try { await posterFond('/api/questionnaire', envoi); } catch (e) { /* toast */ }
    if (q.a_propos) { R()[q.a_propos] = Object.assign({}, r); posterFond('/api/questionnaire', { cle: q.a_propos, valeur, source: r.source, via: r.via, texte_brut: o.texte_brut || '' }).catch(() => {}); }
    effetsProfil(q, valeur);
  }
  function effetsProfil(q, v) {
    const m = {
      'accueil.nom': () => ({ maitre: { nom: String(v || '').slice(0, 40) } }),
      'assistant.nom': () => ({ assistant: { nom: String(v || '').slice(0, 40) } }),
      'assistant.personnalite': () => ({ assistant: { personnalite: String(v || '').slice(0, 120) } }),
      'assistant.humour': () => ['aucun', 'leger', 'absurde', 'geek', 'noir'].includes(v) ? { assistant: { humour: v } } : null,
      'assistant.frequence': () => [15, 30, 60, 120].includes(+v) ? { assistant: { frequence_rapport_min: +v } } : null,
      'assistant.voix': () => ['non', 'oui', 'cloche'].includes(v) ? { assistant: { voix_haute: v } } : null,
      'assistant.espece': () => ['humain', 'robot', 'animal', 'creature'].includes(v) ? { assistant: { espece: v } } : null,
      'assistant.titre': () => typeof v === 'string' ? { assistant: { appellation: v.slice(0, 30) } } : null
    }[q.id];
    const corps = m && m(); if (!corps) return;
    for (const k of Object.keys(corps)) PROFIL[k] = Object.assign({}, PROFIL[k], corps[k]);
    posterFond('/api/profil', corps).catch(() => {});
  }

  // ---- navigation
  function suivante(depuis) {
    if (suivisFile.length) return suivisFile.shift();
    const l = liste(); if (!depuis) return l.find(q => !(q.id in R())) || l[l.length - 1];
    const tous = QF.questions, i = tous.findIndex(q => q.id === depuis.id);
    for (let k = i + 1; k < tous.length; k++) if (incluse(tous[k])) return tous[k];
    return null;
  }
  function avancer() {
    const prec = courant;
    if (retourRecap) { retourRecap = false; return montrer(qDe('fin.valider')); }
    const base = prec && QF.questions.includes(prec) ? prec : dernierQF;
    const q = suivante(base);
    if (base && q && QF.questions.includes(q) && q.chapitre !== base.chapitre && base.chapitre !== 'accueil') finirChapitre(base.chapitre);
    if (!q) return;
    if (prec) pile.push(prec.id);
    montrer(q);
  }
  function reculer() { const id = pile.pop(); if (id) montrer(qDe(id)); }
  function finirChapitre(ch) {
    const finis = chapitresFinis(); if (finis.includes(ch)) return;
    REP.chapitres_finis = finis.concat(ch);
    posterFond('/api/questionnaire', { chapitres_finis: REP.chapitres_finis }).catch(() => {});
    const c = (QF.chapitres || []).find(x => x.id === ch); if (!c) return;
    Bureau.construire(c.construit || [], true);
    Succes.ajouter({ id: 'chapitre-' + (CONF.nom_projet || '') + '-' + ch, icone: '✎', titre: `${t('chapitre_fini')} : ${c.titre}`, sous: '', taille: 'petit' });
  }

  // ---- affichage
  function montrer(q) {
    courant = q; if (QF.questions.includes(q)) dernierQF = q; choixMulti = new Set(Array.isArray(val(q.id)) ? val(q.id) : (Array.isArray(rec(q)) && q.type === 'multi' && !(q.id in R()) ? rec(q) : []));
    if (annulation) { clearTimeout(annulation.minuteur); annulation = null; }
    Voix.arreter();
    majChapitres(q);
    if (q.chapitre && QF.questions.includes(q)) posterFond('/api/questionnaire', { chapitre_courant: q.chapitre }).catch(() => {});
    const cleMsg = 'ded_msg_' + (DED && DED.message_assistant ? String(DED.message_assistant).slice(0, 80) : '');   // un même message n'est dit qu'une fois, même si deductions.json est complété
    const msg = DED && DED.message_assistant && !LS.get(cleMsg, false) ? DED.message_assistant : '';
    if (msg) LS.set(cleMsg, true);
    const r = rec(q), cartes = (q.choix || []).filter(c => cond(c.si));
    const badge = REP.mode === 'adoption' && ANALYSE && ANALYSE.deductions && q.id in (ANALYSE.deductions.probables || {}) ? t('deduit_projet') : t('recommande');   // adoption : la ★ vient du projet
    let milieu = '';
    if (q.type === 'choix' || q.type === 'multi') {
      milieu = `<div class="cartes" role="group">${cartes.map(c => { const estRec = Array.isArray(r) ? r.includes(c.id) : r === c.id; const choisie = q.type === 'multi' ? choixMulti.has(c.id) : val(q.id) === c.id;
        return `<button type="button" class="carte${estRec ? ' rec' : ''}${choisie ? ' choisie' : ''}" data-rec="${esc(badge)}" data-c="${esc(c.id)}">${cheminSur(c.illustration, /\.svg$/i) ? `<img src="${esc(c.illustration)}" alt="" loading="lazy">` : ''}<b>${esc(c.libelle)}</b>${c.detail ? `<small>${esc(c.detail)}</small>` : ''}</button>`; }).join('')}</div>`;
      if (q.libre) milieu += `<div class="sc-libre"><input type="text" id="sc-libre" maxlength="400" placeholder="${esc(t('autre'))}">${boutonMicro('#sc-libre')}<button type="button" class="bts" id="sc-libre-ok">${esc(t('valider'))}</button></div>`;
      else if (q.micro !== false) milieu += `<div class="sc-libre"><input type="text" id="sc-libre" maxlength="400" placeholder="🎙" readonly hidden>${boutonMicro('#sc-libre')}</div>`;
    } else if (q.type === 'texte' || q.type === 'nom' || q.type === 'couleur') {
      const v = val(q.id), defaut = typeof v === 'string' ? v : (q.defaut || '');
      const props = (q.propositions_depuis || REP.mode === 'adoption') && DED && DED.propositions && DED.propositions[q.id] || [];   // adoption : le pitch du README est proposé
      milieu = `<div class="sc-libre">${q.type === 'texte' ? `<textarea id="sc-libre" maxlength="2000">${esc(defaut)}</textarea>` : `<input type="${q.type === 'couleur' ? 'color' : 'text'}" id="sc-libre" maxlength="60" value="${esc(defaut)}">`}${q.micro !== false && q.type !== 'couleur' ? boutonMicro('#sc-libre') : ''}</div>
        ${props.length ? `<div class="puces">${props.slice(0, 8).map(p => `<button type="button" data-p="${esc(p)}">${esc(p)}</button>`).join('')}</div>` : ''}`;
    } else if (q.type === 'curseur') {
      const v = Number.isFinite(+val(q.id)) && val(q.id) !== null ? +val(q.id) : (q.defaut ?? q.min ?? 0);
      milieu = `<div class="curseur"><input type="range" id="sc-curseur" min="${+q.min || 0}" max="${+q.max || 100}" step="${+q.pas || 1}" value="${v}"><output id="sc-out">${v}</output></div>`;
    } else if (q.type === 'personnage') {
      milieu = editeurPerso(q);
    }
    if (q.id === 'fin.valider') milieu = recap() + milieu;
    const passer = q.passer !== false && q.type !== 'personnage';
    const valider = ['multi', 'texte', 'nom', 'couleur', 'curseur', 'personnage'].includes(q.type);
    corps.innerHTML = `<div class="sc-tete"><canvas id="sc-avatar" width="168" height="168"></canvas><div class="bulle"><div class="qui">${esc(nomAssistant())}</div>${msg ? `<p class="msg">${esc(msg)}</p>` : ''}<h2>${esc(q.titre)}</h2>${q.aide ? `<p>${esc(q.aide)}</p>` : ''}</div></div>
      ${milieu}<div id="sc-annule"></div>
      <div class="sc-bas">${pile.length ? `<button type="button" class="bts" id="sc-retour">← ${esc(t('retour'))}</button>` : ''}<span class="espace"></span>
      ${passer ? `<button type="button" class="bts" id="sc-passer">${esc(t('passer'))}</button>` : ''}${valider ? `<button type="button" class="btp" id="sc-valider">${esc(t('valider'))}</button>` : ''}</div>`;
    Bureau.portrait($('#sc-avatar'), lookDe('assistant'));
    lier(q, cartes);
    const f = corps.querySelector('textarea,input[type=text]:not([readonly])'); if (f && (q.type === 'texte' || q.type === 'nom')) setTimeout(() => f.focus(), 50);
    corps.scrollTop = 0; Bureau.taille();
  }
  function majChapitres(q) {
    const ch = (QF.chapitres || []).filter(c => c.id !== 'accueil'), finis = chapitresFinis();
    $('#chapitres').innerHTML = ch.map(c => `<span class="${finis.includes(c.id) ? 'fini' : c.id === q.chapitre ? 'cours' : ''}" title="${esc(c.titre)}">${esc(c.titre)}</span>`).join('');
  }
  function libelleValeur(q, v) {
    if (v === null || v === undefined) return '—';
    const lib = id => { const c = (q.choix || []).find(x => x.id === id); return c ? c.libelle : String(id); };
    if (Array.isArray(v)) return v.map(lib).join(', ');
    if (typeof v === 'object') return '✓';
    return q.choix ? lib(v) : String(v);
  }
  function recap() {
    const parCh = {}; for (const q of QF.questions) if (q.id in R() && q.chapitre !== 'fin') (parCh[q.chapitre] = parCh[q.chapitre] || []).push(q);
    const marque = { utilisateur: '✔', deduit: '~', a_confirmer: '?', voix_a_interpreter: '?' };
    return `<table class="recap"><tbody>${Object.entries(parCh).map(([ch, l]) => `<tr><th colspan="3">${esc(chapTitre(ch))}</th></tr>` + l.map(q => { const r = R()[q.id];
      return `<tr class="ligne" data-q="${esc(q.id)}"><td>${esc(q.titre)}</td><td>${esc(r.texte_brut && r.valeur == null ? '« ' + r.texte_brut + ' »' : libelleValeur(q, r.valeur))}</td><td class="src src-${esc(r.source)}" title="${esc(r.raison || r.source)}">${marque[r.source] || ''}</td></tr>`; }).join('')).join('')}</tbody></table>`;
  }
  function editeurPerso(q) {
    const qui = q.cible === 'assistant' ? 'assistant' : 'maitre', a = JSON.parse(JSON.stringify(lookDe(qui)));
    const sel = (nom, liste, v) => `<label>${esc(nom)}<select data-k="${esc(nom)}">${liste.map(x => `<option${x === v ? ' selected' : ''}>${esc(x)}</option>`).join('')}</select></label>`;
    const col = (nom, v) => `<label>${esc(nom)}<input type="color" data-k="${esc(nom)}" value="${esc(/^#[0-9a-f]{6}$/i.test(v || '') ? v : '#888888')}"></label>`;
    return `<div class="perso-ed" data-qui="${qui}"><canvas width="300" height="300" id="pe-apercu"></canvas><div>
      ${sel('morphologie', ['mince', 'moyenne', 'costaude', 'petite', 'grande'], a.morphologie || 'moyenne')}${col('peau', a.peau)}
      ${sel('coupe', ['courts', 'longs', 'boucles', 'en_bataille', 'queue', 'rase', 'aucune'], (a.cheveux || {}).coupe)}${col('cheveux', (a.cheveux || {}).couleur)}
      ${sel('tenue', ['sweat', 'chemise', 'bleu_de_travail', 'heros', 'tablier', 'costume', 'armure', 'robe'], (a.tenue || {}).style)}${col('couleur1', (a.tenue || {}).couleur1)}${col('couleur2', (a.tenue || {}).couleur2)}
      ${sel('accessoire', ['aucun', 'casque', 'casque_audio', 'casquette', 'beret', 'chapeau', 'lunettes', 'barbe', 'couronne', 'bandeau', 'capuche', 'cornes'], a.accessoire || 'aucun')}
      <div class="rangee"><button type="button" class="bts" data-pe="hasard">🎲 ${esc(t('hasard'))}</button><button type="button" class="bts" data-pe="defaut">${esc(t('defaut'))}</button></div></div></div>`;
  }
  function lirePerso(el) {
    const g = k => el.querySelector(`[data-k="${k}"]`).value;
    return { morphologie: g('morphologie'), peau: g('peau'), cheveux: { coupe: g('coupe'), couleur: g('cheveux') }, tenue: { style: g('tenue'), couleur1: g('couleur1'), couleur2: g('couleur2') }, accessoire: g('accessoire') };
  }

  // ---- interactions
  function lier(q, cartes) {
    const $c = s => corps.querySelector(s);
    const ret = $c('#sc-retour'); if (ret) ret.onclick = () => { Son.clic(); reculer(); };
    const pas = $c('#sc-passer'); if (pas) pas.onclick = async () => { Son.clic(); const r = rec(q); await noter(q, r === undefined ? null : r, { source: 'a_confirmer', via: 'passer' }); avancer(); };
    corps.querySelectorAll('[data-q]').forEach(tr => tr.onclick = () => { retourRecap = true; montrer(qDe(tr.dataset.q)); });
    if (q.type === 'choix') corps.querySelectorAll('.carte').forEach(b => b.onclick = () => choisir(q, b.dataset.c, 'clic'));
    if (q.type === 'multi') corps.querySelectorAll('.carte').forEach(b => b.onclick = () => { Son.clic(); const id = b.dataset.c; if (choixMulti.has(id)) choixMulti.delete(id); else { if (q.max && choixMulti.size >= q.max) return; choixMulti.add(id); } b.classList.toggle('choisie', choixMulti.has(id)); });
    const libre = $c('#sc-libre');
    const ok = $c('#sc-libre-ok'); if (ok) { ok.onclick = () => libreEcrit(q, cartes, libre.value); libre.onkeydown = e => { if (e.key === 'Enter') libreEcrit(q, cartes, libre.value); }; }
    corps.querySelectorAll('[data-micro]').forEach(b => b.onclick = () => dicter(libre, b, texte => { if (q.type === 'choix' || q.type === 'multi') dictee(q, cartes, texte); }));
    corps.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { libre.value = b.dataset.p; libre.focus(); });
    const cur = $c('#sc-curseur'); if (cur) cur.oninput = () => { $c('#sc-out').textContent = cur.value; };
    const ed = $c('.perso-ed');
    if (ed) {
      const maj = () => Bureau.portrait($c('#pe-apercu'), lirePerso(ed));
      ed.querySelectorAll('[data-k]').forEach(i => i.oninput = maj);
      ed.querySelector('[data-pe="hasard"]').onclick = () => { ed.querySelectorAll('select').forEach(s => s.selectedIndex = (Math.random() * s.options.length) | 0); ed.querySelectorAll('input[type=color]').forEach(c => c.value = '#' + ((Math.random() * 0xffffff) | 0).toString(16).padStart(6, '0')); ed.querySelector('[data-k="peau"]').value = PEAUX[(Math.random() * PEAUX.length) | 0]; maj(); };
      ed.querySelector('[data-pe="defaut"]').onclick = () => { const qui = ed.dataset.qui, sauve = PROFIL[qui]; PROFIL[qui] = Object.assign({}, sauve, { apparence: null }); corps.querySelector('.perso-ed').outerHTML = editeurPerso(q); PROFIL[qui] = sauve; lier(q, cartes); };
      maj();
    }
    const val_ = $c('#sc-valider'); if (val_) val_.onclick = async () => {
      Son.clic();
      if (q.type === 'multi') { if (!choixMulti.size) return; await noter(q, [...choixMulti], { via: 'clic' }); }
      else if (q.type === 'curseur') await noter(q, +cur.value, { via: 'clic' });
      else if (q.type === 'personnage') { const qui = ed.dataset.qui, ap = lirePerso(ed); PROFIL[qui] = Object.assign({}, PROFIL[qui], { apparence: ap }); await posterFond('/api/profil', { [qui]: { apparence: ap } }).catch(() => {}); await noter(q, 'choisi', { via: 'clic' }); Bureau.construire(['personnages'], true); }
      else { const v = libre.value.trim(); if (!v && q.passer === false) { libre.focus(); return; } await noter(q, v || null, { via: libre.dataset.via === 'voix' ? 'voix' : 'ecrit', source: v ? 'utilisateur' : 'a_confirmer' }); }
      apres(q);
    };
  }
  async function choisir(q, id, via) {
    Son.clic(); corps.querySelectorAll('.carte').forEach(b => b.classList.toggle('choisie', b.dataset.c === id));
    if (q.id === 'fin.valider') return finir(id);
    if (q.id === 'accueil.mode' && id === 'reprise') { await noter(q, 'reprise', { via }); REP.mode = REP.mode || 'rapide'; pile = []; return montrer(suivante(null)); }
    await noter(q, id, { via });
    setTimeout(() => apres(q), 260);
  }
  function apres(q) {
    if (q.attend_deductions) return attendreDeductions(q);
    avancer();
  }
  function correspondances(cartes, texte) {
    const n = ' ' + norm(texte) + ' ';
    return cartes.filter(c => [c.libelle, ...(c.mots_voix || [])].some(m => { const x = norm(m); return x && n.includes(' ' + x + ' '); }));
  }
  function libreEcrit(q, cartes, texte) {
    texte = String(texte || '').trim(); if (!texte) return;
    const m = correspondances(cartes, texte);
    if (q.type === 'choix' && m.length === 1) return choisir(q, m[0].id, 'ecrit');
    noter(q, texte, { via: 'ecrit', source: 'utilisateur' }).then(() => apres(q));
  }
  // Dictée sur une question à cartes : une seule carte correspond → sélection, 3 s pour annuler ; sinon « à interpréter ».
  function dictee(q, cartes, texte) {
    if (!texte) return;
    const m = correspondances(cartes, texte);
    if (m.length === 1 || (q.type === 'multi' && m.length)) {
      const ids = m.map(c => c.id), zone = corps.querySelector('#sc-annule');
      corps.querySelectorAll('.carte').forEach(b => b.classList.toggle('choisie', ids.includes(b.dataset.c)));
      let s = 3; zone.innerHTML = `<div class="annule">${esc(t('compris'))} : <b>${esc(m.map(c => c.libelle).join(', '))}</b> · <button type="button" class="bts">${esc(t('annuler'))} (<span>${s}</span>)</button></div>`;
      const tic = () => { s--; const sp = zone.querySelector('span'); if (sp) sp.textContent = s; if (s <= 0) { annulation = null; noter(q, q.type === 'multi' ? ids : ids[0], { via: 'voix' }).then(() => apres(q)); } else annulation.minuteur = setTimeout(tic, 1000); };
      annulation = { minuteur: setTimeout(tic, 1000) };
      zone.querySelector('button').onclick = () => { clearTimeout(annulation.minuteur); annulation = null; zone.innerHTML = ''; corps.querySelectorAll('.carte').forEach(b => b.classList.remove('choisie')); };
      return;
    }
    noter(q, null, { via: 'voix', source: 'voix_a_interpreter', texte_brut: texte }).then(() => apres(q));
  }
  function attendreDeductions(q) {
    const depuis = Date.now(), sig0 = DED ? DED_SIG : '';
    corps.innerHTML = `<div class="sc-tete"><canvas id="sc-avatar" width="168" height="168"></canvas><div class="bulle"><div class="qui">${esc(nomAssistant())}</div><p class="attente"><span class="plume"></span>${esc(t('reflechit'))}</p></div></div>
      <div class="sc-bas"><span class="espace"></span><button type="button" class="bts" id="sc-sans" hidden>${esc(t('sans_attendre'))}</button></div>`;
    Bureau.portrait($('#sc-avatar'), lookDe('assistant'));
    const fin = () => { clearInterval(attente); attente = null; avancer(); };
    corps.querySelector('#sc-sans').onclick = fin;
    attente = setInterval(async () => {
      let d = await lire('deductions.json');
      if (d && JSON.stringify(d) !== sig0) {
        DED = avecProjet(d); return fin();   // adoption : ce que l'analyse a déduit du projet reste (fixes, ★ du projet)
      }
      if (Date.now() - depuis > 8000) { const b = corps.querySelector('#sc-sans'); if (b) b.hidden = false; }
      if (Date.now() - depuis > 60000) fin();
    }, 2000);
  }
  async function finir(choix) {
    const q = qDe('fin.valider');
    if (choix === 'corriger') { await noter(q, 'corriger'); const tr = corps.querySelector('.recap'); if (tr) tr.scrollIntoView({ behavior: 'smooth' }); return; }
    if (choix === 'complet') { REP.mode = 'complet'; await posterFond('/api/questionnaire', { mode: 'complet' }).catch(() => {}); pile = []; const l = liste(); return montrer(l.find(x => !(x.id in R()) && x.id !== 'fin.valider') || q); }
    await noter(q, 'oui');
    REP.etat = 'termine';
    finirChapitre('personnages');
    try { await posterFond('/api/questionnaire', { etat: 'termine', chapitre_courant: 'fin' }); } catch (e) { return; }
    scene.classList.add('parti'); setTimeout(() => { scene.hidden = true; document.body.classList.remove('questionnaire'); Bureau.taille(); }, 500);
    Bureau.construire([].concat(...(QF.chapitres || []).map(c => c.construit || [])), true);
    Succes.ajouter({ id: 'questionnaire-' + (CONF.nom_projet || ''), icone: '✓', titre: t('questionnaire_fini'), sous: '', taille: 'moyen' });
    if (window.Roadmap) Roadmap.voici();
  }
  function suivis() {
    if (!SUIVI || !Array.isArray(SUIVI.questions) || !QF) return;
    for (const s of SUIVI.questions) {
      if (!s || !s.id || s.repondue || s.id in R() || suivisFile.some(x => x.id === s.id) || (courant && courant.id === s.id)) continue;
      suivisFile.push(Object.assign({ type: 'choix', libre: true, micro: true, passer: true, chapitre: courant ? courant.chapitre : '' }, s));
    }
  }
  return {
    async demarrer() {
      QF = await lire(`questions.${LANGUE}.json`) || await lire('questions.fr.json');
      if (!QF) return;
      const r = await lire('reponses_questionnaire.json'); if (r && r.reponses) REP = r;
      if (DED_SIG) DED = avecProjet(JSON.parse(DED_SIG));   // le mode (adoption) n'est connu qu'ici
      const finis = chapitresFinis(); Bureau.construire([].concat(...(QF.chapitres || []).filter(c => finis.includes(c.id)).map(c => c.construit || [])), false);
      if (REP.etat === 'termine' || CONF.mode === 'travail') { scene.hidden = true; if (REP.etat === 'termine' && window.Roadmap && !Roadmap.etat()) Roadmap.voici(); return; }
      scene.hidden = false; document.body.classList.add('questionnaire'); Bureau.taille();
      const q = suivante(null);
      const parLui = Object.values(R()).some(x => x && x.source !== 'deduit');
      if (REP.mode === 'adoption' && !parLui) Bureau.dire('assistant', t('reprends'), 8);
      else if (Object.keys(R()).length) Bureau.dire('assistant', t('bienvenue'), 5);
      montrer(q);
    },
    suivis
  };
})();

// ====================================================================== démarrage
$('#bt-notifs').onclick = () => Notifs.basculer();
$('#bt-assistant').onclick = () => demander('assistant');
$('#bt-recruter').onclick = () => recruter();
$('#bt-images').onclick = () => ouvrirMur();
$('#bt-rapport').onclick = () => ouvrirRapport();
$('#bt-decisions').onclick = () => { const l = decisionsOuvertes(); l.forEach(ouvrirDecision); };
$('#niveau').onclick = () => window.Roadmap && Roadmap.ouvrir();
$('#bt-son').onclick = () => { const on = Son.basculer(); $('#son-onde').style.display = on ? '' : 'none'; toast(esc(on ? t('son_on') : t('son_off')), { duree: 1500 }); };
if (Son.coupe()) $('#son-onde').style.display = 'none';
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (Panneau.ouvert()) Panneau.fermer(); else $('#notifs').hidden = true; }
  if ((e.key === 'a' || e.key === 'A') && !e.ctrlKey && !e.metaKey && !e.altKey && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) { e.preventDefault(); demander('assistant'); }
});
document.addEventListener('click', e => { const n = $('#notifs'); if (!n.hidden && !n.contains(e.target) && !$('#bt-notifs').contains(e.target)) n.hidden = true; });
(async function () {
  await chargerTout().catch(e => erreur('chargement', e));
  Bureau.demarrer();
  if (window.Roadmap) {
    await Roadmap.installer({ langue: LANGUE, barre: document.querySelector('.outils'),
      succes: s => Succes.ajouter({ id: 'rm:' + (s.titre || ''), icone: s.icone, titre: s.titre, sous: s.sous, taille: s.taille, son: s.son, clic: s.clic, cible: { roadmap: true } }) });
    const rb = $('#bt-roadmap'); if (rb) $('.outils').insertBefore(rb, $('#bt-decisions'));
  }
  await Quest.demarrer().catch(e => erreur('questionnaire', e));
  setInterval(() => chargerTout().catch(e => erreur('chargement', e)), 10000);
})();
</script>
