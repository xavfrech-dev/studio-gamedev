<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Studio</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2b241c">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Studio">
<!-- Studio gamedev : page générique (aucune dépendance externe).
     Servie par serveur_studio.py --projet <dossier> : lit <projet>/.studio/ (studio.config.json, profil.json,
     roadmap.json, progression/, decisions.json…) et écrit par l'API locale. Contrat : references/studio.md. -->
<link rel="stylesheet" href="roadmap.css">
<style>
:root{
  --nuit:#1a1713;--nuit2:#241f19;--bord:rgba(233,210,160,.16);
  --papier:#f4ecd9;--encre:#2b241c;--encre2:#5c4f3f;--encre3:#8a7b66;
  --ocre:#b98532;--ocre2:#e2b866;--sapin:#3f7a52;--rouge:#a8432e;--bleu:#4d6f9c;
  --sans:"Jeu Interface","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --serif:"Jeu Texte",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#1a1713}
body{color:#efe6d2;font:14px var(--sans);-webkit-font-smoothing:antialiased;background:radial-gradient(1400px 800px at 50% 25%,#2d261e 0%,#1a1713 65%) fixed}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ocre2);outline-offset:2px}

/* ---------- en-tête ---------- */
#entete{position:fixed;inset:0 0 auto 0;z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;background:linear-gradient(180deg,rgba(26,23,19,.95),rgba(26,23,19,.6) 80%,transparent)}
#entete h1{margin:0 auto 0 0;font:400 22px/1.1 var(--serif);letter-spacing:.08em;color:#f1d9a4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
#entete h1 i{font:italic 13px var(--serif);letter-spacing:.02em;color:#cdbb98;margin-left:8px}
.outils{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bt{display:inline-flex;align-items:center;gap:7px;min-height:38px;background:linear-gradient(180deg,rgba(255,250,235,.07),rgba(255,250,235,.02));border:1px solid var(--bord);border-radius:999px;padding:6px 14px;color:#eadfc8;white-space:nowrap;position:relative}
.bt:hover{background:rgba(233,196,127,.10);border-color:rgba(233,196,127,.45)}
.bt svg{width:17px;height:17px;flex:none;color:#e2b866}
.bt.fort{background:linear-gradient(180deg,#d8a650,#b98532);border-color:#d8a650;color:#231b12;font-weight:600}
.bt.fort svg{color:inherit}
.bt .pastille{background:var(--rouge);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;line-height:17px;font-weight:600}
.bt .pastille:empty{display:none}
.bt.sonne svg{animation:sonne 1s ease-in-out 3}
@keyframes sonne{0%,100%{transform:rotate(0)}20%{transform:rotate(14deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}}
#niveau{display:flex;flex-direction:column;gap:3px;min-width:150px;padding:6px 14px;border:1px solid var(--bord);border-radius:14px;background:rgba(255,250,235,.05);color:#e8dcc2;font:13px var(--serif);cursor:pointer;text-align:left}
#niveau b{color:#f1d9a4;font-size:17px}
#niveau .rang{font-style:italic;color:#e2b866}
#niveau .xpm{height:7px;border-radius:3px;background:#3a3128;overflow:hidden}
#niveau .xpm i{display:block;height:100%;width:0;background:linear-gradient(90deg,#c9953e,#f1d9a4);transition:width .8s}

/* ---------- bureau ---------- */
#bureau{position:fixed;inset:0;display:block;width:100%;height:100%;cursor:default}
#bureau.survol{cursor:pointer}#bureau.saisie{cursor:grabbing}
#micro-zone .boutons-bas{display:flex;align-items:flex-end;gap:10px}
#bt-chat{pointer-events:auto;width:50px;height:50px;border-radius:50%;border:2px solid #f1d9a4;background:radial-gradient(circle at 35% 30%,#fbf5e6,#d8c9a6);color:#2b241c;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.5);cursor:pointer}
#bt-chat svg{width:24px;height:24px}#bt-chat:hover,#bt-chat:focus-visible{transform:scale(1.06);outline:2px solid #e2b866;outline-offset:2px}
#lune{position:fixed;left:14px;bottom:34px;z-index:16;font:13px var(--sans);color:#c9d3f5;background:rgba(30,34,52,.85);border:1px solid rgba(142,162,216,.4);border-radius:999px;padding:4px 10px;pointer-events:none}
#entete #bt-absent.actif{background:#2c3550!important;color:#dfe6ff!important;border-color:#8ea2d8!important}
#equipe .membre.glisse{opacity:.45}#equipe .membre.cible-haut{box-shadow:0 -3px 0 #e2b866}#equipe .membre.cible-bas{box-shadow:0 3px 0 #e2b866}
#equipe .ordre-defaut{pointer-events:auto;width:176px;font-size:11px;background:rgba(26,23,19,.78);border:1px solid rgba(233,210,160,.25);border-radius:999px;color:#e8dcc2;padding:3px 10px;cursor:pointer}
#micro-zone{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:26;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
#gros-micro{pointer-events:auto;width:64px;height:64px;border-radius:50%;border:2px solid #f1d9a4;background:radial-gradient(circle at 35% 30%,#e9c47f,#b98532);color:#231b12;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.5),0 0 0 6px rgba(233,196,127,.15);cursor:pointer;transition:transform .15s}
#gros-micro:hover{transform:scale(1.06)}#gros-micro svg{width:30px;height:30px}#gros-micro.ecoute{background:radial-gradient(circle at 35% 30%,#e07a5f,#a8432e);color:#fff;animation:dec-pouls 1s infinite}
#micro-carte{pointer-events:auto;width:min(460px,86vw);color:var(--encre,#2b241c);border-radius:12px;padding:14px 16px;background:linear-gradient(180deg,#fbf5e6,#efe3c7);box-shadow:0 18px 40px rgba(0,0,0,.5)}
#micro-carte textarea{width:100%;min-height:70px;border:1px solid rgba(92,79,63,.3);border-radius:8px;padding:8px;background:#fffdf6;color:var(--encre,#2b241c);font:inherit}
#micro-carte select{border:1px solid rgba(92,79,63,.3);border-radius:8px;padding:6px;background:#fffdf6;color:var(--encre,#2b241c)}
#micro-carte .direct{font:italic 1.05em var(--serif);min-height:1.4em}
#bulle-info{position:fixed;z-index:24;pointer-events:none;background:rgba(30,25,20,.92);color:#f3e9d2;border:1px solid rgba(233,210,160,.25);border-radius:8px;padding:6px 9px;font-size:12px;line-height:1.35;transform:translate(-50%,-120%);white-space:nowrap;opacity:0;transition:opacity .12s}
#bulle-info b{font-family:var(--serif);font-weight:400;color:#f1d9a4;font-size:13px}#bulle-info .vie{height:5px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;margin:5px 0}#bulle-info .vie i{display:block;height:100%;background:#6fae5e}
#fraicheur{font:12px var(--sans);padding:5px 11px;border-radius:999px;border:1px solid rgba(111,174,94,.45);color:#cfe6c4;background:rgba(111,174,94,.12)}#fraicheur.vieux{border-color:rgba(224,138,114,.5);color:#f3c2b2;background:rgba(168,67,46,.18)}
body.t-petite #entete,body.t-petite #equipe,body.t-petite #panneau,body.t-petite #toasts,body.t-petite #notifs{zoom:.88}
body.t-grande #entete,body.t-grande #equipe,body.t-grande #panneau,body.t-grande #toasts,body.t-grande #notifs,body.t-grande #micro-zone{zoom:1.15}
#zoom{position:fixed;right:14px;bottom:14px;z-index:14;display:flex;flex-direction:column;gap:6px}
#zoom button{width:42px;height:42px;border-radius:10px;border:1px solid rgba(233,210,160,.28);background:rgba(30,25,20,.82);color:#f1d9a4;font:600 18px var(--sans);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.35);cursor:pointer}
#zoom button:hover{background:rgba(60,50,38,.92)}#zoom button svg{width:16px;height:16px}
body.questionnaire #indice,body.app #indice{display:none}
#indice{position:fixed;left:16px;bottom:12px;z-index:5;font:12px var(--sans);color:#bfb196;pointer-events:none}

/* ---------- notifications ---------- */
#notifs{position:fixed;right:16px;top:64px;z-index:36;width:min(380px,92vw);max-height:70vh;overflow:auto;color:var(--encre);border-radius:6px 12px 12px 12px;padding:12px 14px;background:linear-gradient(180deg,#fbf5e6,#efe3c7);box-shadow:0 18px 40px rgba(0,0,0,.5);border:1px solid rgba(185,133,50,.35)}
#notifs h2{font:italic 400 19px var(--serif);margin:0 0 6px;display:flex;justify-content:space-between;align-items:center}
#notifs h2 button{font:12px var(--sans);background:none;border:0;color:var(--ocre);text-decoration:underline}
.notif{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-bottom:1px dotted rgba(92,79,63,.3);padding:8px 4px;color:var(--encre)}
.notif:hover{background:rgba(185,133,50,.1)}
.notif .ni{width:24px;height:24px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#e9dcc0;font-size:12px}
.notif.t-succes .ni,.notif.t-fait .ni{background:#d9ead9;color:#2f6b3f}.notif.t-decision .ni{background:#f6e2b8;color:#8a5b12}.notif.t-alerte .ni{background:#f2d4cb;color:#93351f}
.notif .nt{flex:1;min-width:0}.notif .nt b{display:block;font:400 14px var(--serif)}.notif .nt small{display:block;color:var(--encre2);font-size:12px}
.notif time{font:11px Consolas,monospace;color:var(--ocre)}
.notif.nonlue .nt b{font-weight:700}
.vide{color:var(--encre3);font-style:italic;padding:8px 0}
#toasts{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;max-width:min(380px,90vw);background:linear-gradient(180deg,#3a3128,#2a241d);border:1px solid rgba(226,184,102,.45);border-radius:10px;padding:9px 14px;color:#f4ecd9;box-shadow:0 10px 26px rgba(0,0,0,.45);transition:opacity .4s,transform .4s}
.toast.erreur{border-color:#c2533c}
#entete .bt.danger.rallumer,.bt.rallumer{background:#3f7a52;color:#fff;border-color:#8fc49e}
.toast{position:relative;width:min(560px,92vw);max-width:min(560px,92vw);font-size:18px;line-height:1.35;padding:12px 16px 12px 58px}
.toast::before{content:attr(data-picto);position:absolute;left:16px;top:12px;font-size:26px;line-height:1}
.toast.part{opacity:0;transform:translateY(8px)}
.toast button{background:none;border:0;color:#e2b866;text-decoration:underline;padding:0 0 0 8px}

/* ---------- panneau central (file unique) ---------- */
#panneau{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;background:rgba(15,12,9,.55);opacity:0;pointer-events:none;visibility:hidden;transition:opacity .25s,visibility 0s linear .25s}
#panneau.vu{opacity:1;pointer-events:auto;visibility:visible;transition:opacity .25s,visibility 0s}
#panneau .feuille{position:relative;width:min(640px,94vw);max-height:86vh;overflow:auto;color:var(--encre);border-radius:8px 16px 16px 8px;padding:22px 26px 24px;background:radial-gradient(120% 90% at 30% 0%,#fbf6e8 0%,#f2e8cf 55%,#e8d9b6 100%);box-shadow:0 24px 60px rgba(0,0,0,.55);transform:translateY(10px);transition:transform .25s}
#panneau.vu .feuille{transform:none}
#panneau .feuille p,#panneau .feuille li{overflow-wrap:anywhere}   /* un long chemin sans espace ne fait plus défiler la fenêtre de côté (téléphone) */
#panneau .x{position:sticky;top:0;float:right;width:34px;height:34px;border-radius:50%;border:1px solid rgba(43,36,28,.2);background:rgba(255,250,238,.9);font-size:20px;line-height:1;margin:-8px -10px 0 8px}
#panneau .file{font:12px var(--sans);color:var(--encre3);margin:0 0 4px}
.surtitre{font:600 10.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ocre)}
.feuille h2{font:400 26px/1.15 var(--serif);margin:3px 0 8px}
.feuille h3{font:italic 400 17px var(--serif);color:#7a5a2a;margin:18px 0 6px}
.feuille p{line-height:1.5}
.discret{color:var(--encre3);font-size:12.5px}
dl.compteurs{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin:0}
dl.compteurs div{background:linear-gradient(180deg,#fffaf0,#f6ecd6);border:1px solid rgba(92,79,63,.16);border-radius:4px 10px 4px 10px;padding:9px 11px;box-shadow:0 2px 6px rgba(80,60,30,.12)}
dl.compteurs dt{font-size:11px;color:var(--encre3);margin:0}
dl.compteurs dd{margin:2px 0 0;font:400 1.35em var(--serif);color:var(--encre);word-break:break-word}
/* Santé du PC (jumeau du skill) : jauges des compteurs, même carte que dl.compteurs */
dl.compteurs.jauges-sante{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
dl.jauges-sante dd{font-size:1.2em}
dl.jauges-sante .jauge{display:block;height:7px;margin:6px 0 3px;border-radius:4px;background:#e3d4b2;box-shadow:inset 0 1px 2px rgba(80,60,30,.25);overflow:hidden}
dl.jauges-sante .jauge i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#6fae5e,#3f7a52)}
dl.jauges-sante .chaud .jauge i{background:linear-gradient(90deg,#d9822b,#a8432e)}
dl.jauges-sante .chaud dd{color:#a8432e}
dl.jauges-sante .illisible dd{color:var(--encre3)}
dl.jauges-sante .illisible .jauge{background:repeating-linear-gradient(135deg,#e8dcc2 0 5px,#f3ead6 5px 10px)}
dl.jauges-sante small{display:block;font-size:11px;line-height:1.3;color:var(--encre3);margin-top:2px;overflow-wrap:anywhere}
.sante-cause{color:#a8432e;margin:.5em 0 .2em}
dl.jauges-sante small.illisible{font-style:italic}
.rangee{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.bts{border:1px solid rgba(92,79,63,.3);background:#fffdf6;border-radius:999px;padding:7px 14px;color:var(--encre)}
.bts:hover{border-color:var(--ocre)}
.btp{border:1px solid #c9953e;background:linear-gradient(180deg,#e2b866,#c9953e);border-radius:999px;padding:7px 16px;color:#231b12;font-weight:600}
.btp:disabled{opacity:.5;cursor:default}
.feuille textarea,.feuille input[type=text]{width:100%;border:1px solid rgba(92,79,63,.3);border-radius:8px;padding:8px 10px;background:#fffdf6;color:var(--encre)}
.feuille textarea{min-height:76px;resize:vertical}
.barre{position:relative;height:20px;border-radius:7px;background:#e3d4b2;box-shadow:inset 0 1px 3px rgba(80,60,30,.3);overflow:hidden;margin:6px 0}
.barre i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#c9953e,#6fa75c)}
.barre span{position:relative;display:block;text-align:center;font:600 12px/20px var(--sans)}
.etapes{margin:6px 0 0;padding-left:22px}.etapes li{margin:3px 0}
.choix-dec{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.choix-dec button{text-align:left}
.choix-dec button.rec{border-color:#c9953e;box-shadow:0 0 0 2px rgba(226,184,102,.4)}
.micro.actif{background:#c2533c;color:#fff;border-color:#c2533c}

/* P4 : thème clair (html[data-theme=clair]) : fond papier, en-tête et groupe clairs ; la scène garde son décor ; réglage auto / clair / sombre */
html[data-theme=clair] body{color:#2b241c;background:radial-gradient(1400px 800px at 50% 25%,#f7efdd 0%,#e6d8bb 70%) fixed}
html[data-theme=clair] #entete h1{color:#6b4a1e}
html[data-theme=clair] .bt{background:linear-gradient(180deg,#fffaf0,#efe4cc);color:#3b2f22;border-color:rgba(92,79,63,.28)}
html[data-theme=clair] .bt:hover{background:#fff7e6}
html[data-theme=clair] #v1,html[data-theme=clair] #niveau,html[data-theme=clair] #horloge{background:rgba(255,252,244,.8);color:#3b2f22;border-color:rgba(92,79,63,.25)}
html[data-theme=clair] #fraicheur{color:#2f6b3f;background:rgba(111,174,94,.16)}
html[data-theme=clair] #equipe .membre{background:rgba(255,251,242,.94);color:#2b241c;border-color:rgba(92,79,63,.22)}
html[data-theme=clair] #equipe .membre small,html[data-theme=clair] #equipe .membre .e{color:#5a4a36!important}
html[data-theme=clair] .toast{background:linear-gradient(180deg,#fffaf0,#f1e6cf);color:#2b241c;border-color:rgba(185,133,50,.5)}
html[data-theme=clair] #zoom button{background:rgba(255,251,242,.92);color:#6b4a1e;border-color:rgba(92,79,63,.28)}
html[data-theme=clair] #indice{color:#6b5a44}
html[data-theme=clair] body.app #onglets-app{background:#f4ead6;border-top-color:rgba(92,79,63,.22)}
html[data-theme=clair] body.app #onglets-app button{color:#5a4a36}html[data-theme=clair] body.app #onglets-app button.actif{color:#8a5b12}
html[data-theme=clair] body.app #bt-plus-app{background:rgba(255,251,242,.9);color:#3b2f22}
html[data-theme=clair] #radio-titre{color:rgba(90,74,54,.7);text-shadow:none}
html[data-theme=clair] #entete{background:linear-gradient(180deg,rgba(247,239,221,.97),rgba(247,239,221,.75) 80%,rgba(247,239,221,0))}
html[data-theme=clair] #equipe .n{color:#2b241c}html[data-theme=clair] #equipe .e{color:#5a4a36}html[data-theme=clair] #equipe .rt{color:#8a5b12}
html[data-theme=clair] #v1 b,html[data-theme=clair] #horloge b,html[data-theme=clair] #niveau b{color:#8a5b12}html[data-theme=clair] #niveau .rang{color:#8a5b12}html[data-theme=clair] #niveau .xpm{background:#e2d4b4}
/* P9 : grand écran : l'interface (en-tête, groupe, panneaux, questionnaire, notifications, micro, zoom) grandit avec l'écran ;
   le canevas de la scène n'est pas agrandi (il se redessine à la taille de la fenêtre) */
.ic-etat{display:inline-block;vertical-align:-.18em;flex:none}
:root{--k:1;--etat-travaille:#6fae5e;--etat-attend:#c9953e;--etat-fini:#4d6f9c;--etat-disponible:#8fb3c9;--etat-bloque:#c0573e;--etat-inconnu:#8a8174}
@media (min-width:1800px) and (min-height:950px){:root{--k:1.15}}
@media (min-width:2200px) and (min-height:1200px){:root{--k:1.32}}
@media (min-width:3000px) and (min-height:1600px){:root{--k:1.6}}
body:not(.app) #entete,body:not(.app) #equipe,body:not(.app) #panneau,body:not(.app) #scene,body:not(.app) #toasts,body:not(.app) #micro-zone,body:not(.app) #zoom,body:not(.app) #succes,body:not(.app) #rm-panneau{zoom:var(--k)}body:not(.app) #notifs{zoom:calc(var(--k) * .88)}
body:not(.app) #scene{width:min(1200px,100vw / var(--k))}
.carte-dec .choix-dec{display:grid;gap:8px;margin:10px 0}.carte-dec .choix-dec .bts{display:flex;align-items:center;gap:10px;width:100%;justify-content:flex-start;text-align:left;padding:12px 14px;border-radius:12px;min-height:48px;font-size:15px}
.carte-dec .choix-dec .bts.rec{box-shadow:0 0 0 2px var(--ocre)}.carte-dec kbd{font:600 12px var(--sans);min-width:22px;height:22px;line-height:22px;text-align:center;border-radius:6px;background:rgba(92,79,63,.12);color:var(--encre2)}
body.app .carte-dec kbd{display:none}
.micro{display:inline-flex;align-items:center;gap:6px}
.carte-jour .jour-heros{font-size:1.1em;margin:.2em 0 .6em}.carte-jour .jour-heros b{font-size:1.4em}.jour-bloc{border-top:1px solid rgba(92,79,63,.15);padding-top:6px;margin-top:8px}.jour-bloc h3{margin:.2em 0 .3em}
.choix-dec.balayable{touch-action:pan-y;transition:transform .25s ease}.choix-dec.balayable[data-sens=droite]{box-shadow:0 0 0 3px #3f7a52;border-radius:12px}.choix-dec.balayable[data-sens=gauche]{box-shadow:0 0 0 3px #c2533c;border-radius:12px}
.aide-balayage{text-align:center;color:var(--encre3);font-size:14px;margin:.4em 0}.micro .ic-micro{width:20px;height:20px;flex:none}
.micro.actif{position:relative}.micro.actif::after{content:"";position:absolute;inset:-4px;border-radius:inherit;border:2px solid #c2533c;animation:pulse-micro 1.2s ease-out infinite;pointer-events:none}
@keyframes pulse-micro{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(1.25)}}
@media (prefers-reduced-motion:reduce){.micro.actif::after{animation:none}}

/* panneau plein cadre (rapport, mur d'images) */
#panneau.large .feuille{width:min(1180px,96vw);max-height:92vh;padding:24px 30px 26px}
/* recrutement */
.form-rec{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:10px}
.form-rec .champ{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--encre2)}
.form-rec .plein{grid-column:1/-1}
.form-rec select,.form-rec input[type=color]{border:1px solid rgba(92,79,63,.3);border-radius:6px;background:#fffdf6;padding:4px 6px;color:var(--encre);min-height:34px}
.form-rec .coche{flex-direction:row;align-items:center;gap:8px}
.form-rec .ligne-champ{display:flex;gap:8px;align-items:flex-start}.form-rec .ligne-champ>:first-child{flex:1}
#rc-res.erreur{color:var(--rouge);font-weight:600}
/* mur d'images */
.mur{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:12px}
.mur button{display:flex;flex-direction:column;gap:4px;padding:6px;border:1px solid rgba(92,79,63,.25);border-radius:8px;background:#fffdf6;text-align:left;color:var(--encre)}
.mur button:hover{border-color:var(--ocre);transform:translateY(-1px)}
.mur img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:5px;background:#e9dcbc}
.mur b{font:400 14px/1.2 var(--serif)}.mur small{font-size:11.5px;color:var(--encre3)}
.cadre{display:flex;flex-direction:column;gap:8px;align-items:center}
.cadre img{max-width:100%;max-height:72vh;object-fit:contain;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.3);background:#2b241c}
/* rapport de l'assistant */
.rapport-tete{display:flex;gap:16px;align-items:center}
.rapport-tete canvas{width:92px;height:92px;flex:none;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fffaf0,#e9dcbc);box-shadow:0 0 0 3px #e2b866}
.rapport-tete .bulle{font:italic 16px/1.45 var(--serif);color:var(--encre)}
.tab-rapport{width:100%;border-collapse:collapse;margin:8px 0;font-size:14px}
.tab-rapport th{text-align:left;font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--encre3);padding:6px 6px;border-bottom:1px solid rgba(92,79,63,.3)}
.tab-rapport td{padding:7px 6px;border-bottom:1px dotted rgba(92,79,63,.25);vertical-align:middle}
.tab-rapport .barre{margin:0;height:16px}.tab-rapport .barre span{line-height:16px;font-size:11px}
.liste-ok{list-style:none;padding:0;margin:4px 0}.liste-ok li{padding:3px 0}.liste-ok li::before{content:"✓ ";color:var(--sapin);font-weight:700}
.liste-dec{display:flex;flex-direction:column;gap:6px;margin:6px 0}.liste-dec button{text-align:left}
@media (max-width:640px){.form-rec{grid-template-columns:1fr}.mur{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}}
/* conversation avec l'assistant (fil) */
.fil .md p{margin:.3em 0}.fil .md pre{max-height:300px;overflow:auto}.fil .md h2,.fil .md h3,.fil .md h4{margin:.4em 0;font-size:1.05em}
.fil{display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 330px);overflow:auto;padding:6px 2px 10px;margin:6px 0 10px;border-bottom:1px solid rgba(92,79,63,.2)}
.fil .msg{max-width:78%;padding:8px 12px;border-radius:12px;background:#fffdf6;border:1px solid rgba(92,79,63,.22);box-shadow:0 2px 6px rgba(80,60,30,.08)}

/* fin de tâche, renvoi */
.encadre{border:1px solid rgba(92,79,63,.3);border-radius:10px;padding:10px 14px;margin:12px 0;background:#fffaf0}

.rangee.choix{flex-wrap:wrap}
#alerte-etat{display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex-basis:100%;order:99;margin:2px 0 0;padding:6px 10px 6px 14px;border-radius:10px;background:#5c4214;color:#fbf0d8;border:1px solid #c99a3e;font:14px var(--sans)}
#alerte-etat[hidden]{display:none}#alerte-etat.coupe{background:#5a2d22;border-color:#e08a72}#alerte-etat .bts,#alerte-etat .x{min-height:32px;padding:4px 12px;font-size:13px}#alerte-etat .x{margin-left:auto;background:none;border:0;color:#fbf0d8;font-size:20px;line-height:1;cursor:pointer}
#alerte-etat-ancien{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:40;max-width:min(720px,92vw);padding:8px 16px;border-radius:10px;background:#7a2a1c;color:#fbe9e2;border:1px solid #c2533c;font:13.5px var(--sans);box-shadow:0 8px 20px rgba(0,0,0,.4)}
.reglage{display:flex;gap:10px;align-items:center;margin:8px 0}

/* ---------- bandeau des succès (file) ---------- */
#succes{position:fixed;left:50%;top:14px;transform:translate(-50%,-150%);z-index:70;min-width:min(520px,92vw);display:flex;align-items:center;gap:16px;padding:12px 26px 12px 14px;border-radius:14px;cursor:pointer;background:linear-gradient(180deg,#3a3128,#241f19);border:2px solid #e2b866;color:#f4ecd9;box-shadow:0 16px 40px rgba(0,0,0,.55);transition:transform .55s cubic-bezier(.2,1.4,.3,1)}

#succes .sur{font:600 11px var(--sans);letter-spacing:.18em;text-transform:uppercase;opacity:.75}

/* ---------- scène du questionnaire (mode accueil) ---------- */
#scene{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:30;width:min(980px,100vw);max-height:56vh;display:flex;flex-direction:column;color:var(--encre);border-radius:16px 16px 0 0;background:radial-gradient(120% 90% at 30% 0%,#fbf6e8 0%,#f2e8cf 55%,#e8d9b6 100%);box-shadow:0 -14px 50px rgba(0,0,0,.55);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#scene.parti{transform:translate(-50%,110%)}
#chapitres{display:flex;gap:4px;padding:10px 18px 0;flex-wrap:wrap}
#chapitres span{flex:1;min-width:56px;height:24px;border-radius:5px;background:rgba(92,79,63,.12);font:600 10.5px/24px var(--sans);text-align:center;color:var(--encre3);letter-spacing:.04em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 4px}
#chapitres span.fini{background:#d9ead9;color:#2f6b3f}
#chapitres span.cours{background:#f6e2b8;color:#8a5b12;box-shadow:0 0 0 2px var(--ocre)}
#chap-prog{display:none;padding:10px 18px 0;font:600 13px var(--sans);color:var(--encre2)}#chap-prog .piste{height:6px;border-radius:3px;background:rgba(92,79,63,.15);margin-top:6px;overflow:hidden}#chap-prog .piste i{display:block;height:100%;background:var(--ocre);border-radius:3px}
body.questionnaire #scene{max-height:70vh}
body.questionnaire #entete .outils>*:not(#bt-son):not(#bt-plein):not(#bt-reglages):not(#menu-plus):not(#bt-plus-pc){display:none!important}body.questionnaire #menu-plus>*:not(#bt-plein):not(#bt-reglages){display:none!important}body.app.questionnaire #bt-plus-app{display:none!important}
body.app.questionnaire #scene{max-height:calc(100dvh - 150px - 64px - env(safe-area-inset-bottom))}

#v1 .piste{width:150px;height:12px;border-radius:6px;background:#3a3128;border:1px solid rgba(0,0,0,.4);overflow:hidden}#v1 .plein{height:100%;width:0;background:linear-gradient(90deg,#c9953e,#7fae5e);transition:width .8s}
#v1 b{font:600 15px var(--sans);color:#f1d9a4}
@media (max-width:900px){#v1 .piste{width:70px}#horloge{display:none}}
@media (prefers-reduced-motion:reduce){#scene,#succes,#panneau,.carte{transition:none}.plume{animation:none}*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition:none!important}}
@media (max-width:640px){#v1{max-width:calc(100vw - 32px);min-width:0}#v1 .piste{width:56px}#entete{max-width:100vw;overflow:hidden}}
/* téléphone : barre d'outils sur une ligne qui défile, icônes seules (le texte reste lu par les lecteurs d'écran) */
@media (max-width:640px){#entete .outils,.outils{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;max-width:100%;gap:6px;padding-bottom:2px;-webkit-overflow-scrolling:touch}.outils::-webkit-scrollbar{display:none}.outils>*{flex:0 0 auto}.outils .bt>span[data-t]{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}#entete .outils .bt,#entete .outils .bt.fort,#entete #bt-optim,#entete #bt-notifs,#entete #bt-son{padding:7px 10px;min-width:0}}
/* mode application (téléphone, écran d'accueil) : barre d'onglets en bas, panneaux plein écran, gros boutons */
#onglets-app{display:none}
body.app #onglets-app{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:70;height:calc(64px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#211b15;border-top:1px solid rgba(226,184,102,.35);box-shadow:0 -6px 18px rgba(0,0,0,.45)}
body.app #onglets-app button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;color:#d9c9a8;font:500 12px system-ui,sans-serif;min-height:56px;position:relative}
body.app #onglets-app button svg{width:24px;height:24px}
body.app #onglets-app button.actif{color:#f1c86e}body.app #onglets-app button.actif::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:#e2b866}
body.app #onglets-app .pastille{position:absolute;top:6px;right:calc(50% - 22px);font-size:10px;min-width:16px;background:#c2533c;color:#fff;border-radius:8px;padding:0 4px}
body.app #equipe{bottom:calc(72px + env(safe-area-inset-bottom))!important}
body.app #micro-zone{bottom:calc(150px + env(safe-area-inset-bottom))}
body.app #panneau{left:0!important;right:0!important;width:100vw!important;max-width:100vw!important;bottom:calc(64px + env(safe-area-inset-bottom))!important;top:0!important;border-radius:0!important}
body.app #panneau .feuille{width:100vw;max-height:100%;height:100%;border-radius:0;padding:18px 16px}
body.app .bt,body.app .btp,body.app .bts{min-height:44px}
body.app #conv-texte{font-size:17px}
/* T3 : bords sûrs (encoche, indicateur d'accueil) en haut, à gauche et à droite aussi */
#entete{padding-top:calc(10px + env(safe-area-inset-top));padding-left:calc(16px + env(safe-area-inset-left));padding-right:calc(16px + env(safe-area-inset-right))}
body.app #panneau .feuille{padding-top:calc(18px + env(safe-area-inset-top));padding-left:calc(16px + env(safe-area-inset-left));padding-right:calc(16px + env(safe-area-inset-right))}
body.app #rm-panneau{padding-top:env(safe-area-inset-top)}
body.app #toasts{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
/* T2 : clavier ouvert, la barre d'onglets s'efface et le panneau descend jusqu'en bas */
body.app.clavier #onglets-app{display:none}
/* T13 : réponse libre repliée ; cloche vide */
.autre-rep{margin-top:10px}.autre-rep>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:#6b5a42;font-size:15px}
.cloche-vide{text-align:center;padding:40px 16px;color:#5c4f3f}.cloche-vide .ic{font-size:44px;opacity:.6}.cloche-vide p{font-size:17px}
/* T14 : onglets : état actif marqué, retour au toucher, pastille lisible */
#onglets-app button{-webkit-tap-highlight-color:transparent}#onglets-app button:active{transform:scale(.94)}
body.app #onglets-app button[aria-current="page"] svg{stroke-width:2.2}
body.app #onglets-app .pastille{font-weight:700;min-width:18px;height:18px;line-height:18px;box-shadow:0 0 0 2px #211b15}
/* T16 : fermetures de 44 px */
#panneau .x{width:44px!important;height:44px!important;font-size:22px}
/* T19 : hauteur visible réelle (barre d'adresse comprise) */
@supports (height:100dvh){.fil{max-height:calc(100dvh - 330px)}}

/* P3 : barre d'outils en trois temps : actions et vues, puis icônes seules, puis « ⋯ » ; Tout couper à part */
#menu-plus{display:none}
body:not(.app) #menu-plus.ouvert{display:grid;position:absolute;right:16px;top:calc(100% - 4px);z-index:30;grid-template-columns:1fr;gap:6px;min-width:250px;padding:10px;border-radius:12px;background:#211b15;border:1px solid rgba(226,184,102,.4);box-shadow:0 18px 40px rgba(0,0,0,.55)}
body:not(.app) #menu-plus .bt{width:100%;justify-content:flex-start;min-width:0!important}
#menu-plus #bt-optim{background:linear-gradient(180deg,#f4ecd9,#e3d5b5)!important;color:#2b241c!important;min-width:0!important;font-size:inherit!important}
body:not(.app) #entete nav.outils #bt-plus-pc{display:inline-flex}
#bt-plus-pc{display:none;min-width:46px!important;font-size:22px;line-height:1;justify-content:center}
body:not(.app) #entete nav.outils>.bt.icone>span[data-t]{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
body:not(.app) #entete nav.outils>.bt.icone{min-width:46px!important;padding:8px 11px}
body:not(.app) #entete #bt-couper{margin-left:14px}
body.app.feuille-actions #menu-plus{display:contents}
/* P9 : l'équipe reste sur une colonne et défile ; notifications à gauche des boutons de zoom */
@media (min-width:901px){#equipe{flex-wrap:nowrap!important;overflow-y:auto;overflow-x:hidden;pointer-events:auto;scrollbar-width:thin;scrollbar-color:rgba(226,184,102,.45) transparent;padding-right:6px;overscroll-behavior:contain}#toasts{right:72px}
  #equipe::-webkit-scrollbar{width:9px}#equipe::-webkit-scrollbar-track{background:rgba(255,255,255,.04);border-radius:5px}#equipe::-webkit-scrollbar-thumb{background:rgba(226,184,102,.45);border-radius:5px}}
/* P12 : textes atténués lisibles (AA) */
#entete .discret,.membre .e,#notifs small,#notifs time{color:#b3a283}
.feuille .discret,.feuille .surtitre{color:#6b5a42}
/* P8 : fiche des raccourcis */
#fiche-raccourcis{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:90;width:min(420px,92vw);padding:18px 22px;border-radius:14px;background:#f4ecd9;color:#2b241c;box-shadow:0 24px 60px rgba(0,0,0,.6)}
#fiche-raccourcis[hidden]{display:none}#fiche-raccourcis table{width:100%;border-collapse:collapse;margin:8px 0}#fiche-raccourcis td{padding:5px 4px;border-bottom:1px solid rgba(92,79,63,.15)}
#fiche-raccourcis kbd{display:inline-block;min-width:26px;text-align:center;padding:2px 6px;border-radius:6px;border:1px solid #8a7b66;background:#fff;font:600 13px system-ui,sans-serif}

/* T8 : au téléphone, corps à 16 px, texte secondaire à 14 px au moins */
body.app #panneau .feuille{font-size:16px;line-height:1.45}
body.app .discret,body.app .surtitre,body.app .membre .e,body.app #equipe .membre small{font-size:14px!important}
body.app #onglets-app button{font-weight:600}
body.app #onglets-app .pastille{font-size:11px;min-width:18px;line-height:16px}
/* T9 : réglages en lignes tactiles ; interrupteurs à la place des cases ; listes et curseurs à la taille du doigt */
body.app #panneau .reglage{min-height:52px;margin:0;padding:6px 0;border-bottom:1px solid rgba(92,79,63,.14);justify-content:space-between;font-size:16px}
body.app #panneau .reglage:has(input[type=checkbox]){flex-direction:row-reverse}
body.app #panneau .reglage input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:51px;height:31px;border-radius:16px;background:#cdbf9f;position:relative;margin:0;cursor:pointer;transition:background .2s}
body.app #panneau .reglage input[type=checkbox]::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
body.app #panneau .reglage input[type=checkbox]:checked{background:#3f7a52}body.app #panneau .reglage input[type=checkbox]:checked::after{transform:translateX(20px)}
body.app #panneau .reglage input[type=checkbox]:focus-visible{outline:2px solid #b98532;outline-offset:2px}
body.app #panneau .reglage input[type=checkbox]:disabled{opacity:.45}
body.app #panneau .reglage select{min-height:40px;font-size:16px;max-width:55%;flex:none}
body.app #panneau .reglage input[type=range]{height:32px;width:45%;flex:none}
body.app #panneau .reglage input[type=text]{min-height:40px;font-size:16px}
#panneau h3.rg-groupe{margin:18px 0 2px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#8a7b66}
/* T12 : tirer vers le bas ne recharge plus la page ; les listes défilent sans entraîner la page */
html,body{overscroll-behavior:none}
#panneau .feuille,#panneau .fil,#rm-panneau .rm-feuille,#notifs{overscroll-behavior:contain}

.conv-vide{text-align:center;padding:36px 12px 16px;color:#5c4f3f}.conv-vide .av{width:56px;height:56px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:#2b241c;color:#f1c86e}
.conv-vide p{font-size:18px;margin:0 0 14px}.conv-vide .sugg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.conv-vide .sugg .bts{min-height:40px;border-radius:999px;padding:6px 16px}
.toast.groupe{cursor:pointer}
body.app #panneau.conv-app .surtitre,body.app #panneau.conv-app .conv-aide{display:none}body.app #panneau.conv-app h2{font-size:20px;margin:0 0 8px;padding:0 8px 0 48px;min-height:40px;line-height:1.2;display:flex;align-items:center}body.app.feuille-actions #bt-son::after{content:attr(title)}
/* T7 : en-tête compact (56 px) ; les outils passent dans la feuille d'actions « ⋯ » */
#bt-plus-app,#voile-actions{display:none}
body.app #entete{flex-wrap:nowrap;min-height:56px;padding-top:calc(6px + env(safe-area-inset-top));padding-bottom:6px;gap:8px}
body.app #entete h1{flex:1;min-width:0;max-width:none;font-size:18px;margin:0}
body.app #horloge,body.app #niveau,body.app #v1 .piste,body.app #v1>span{display:none!important}
body.app #v1{padding:4px 10px;gap:0;flex:none}
body.app #fraicheur{font-size:0;padding:0;width:12px;height:12px;border-radius:50%;background:#6fae5e;border:0;flex:none;cursor:pointer}body.app #fraicheur.vieux{background:#e08a4a}
body.app #bt-plus-app{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;flex:none;border-radius:12px;border:1px solid rgba(226,184,102,.4);background:rgba(255,250,235,.06);color:#f1e3c3;font-size:24px;line-height:1}
body.app #alerte-etat{position:fixed;left:8px;right:8px;top:calc(60px + env(safe-area-inset-top));z-index:21}
body.app:not(.feuille-actions) #entete nav.outils{display:none}
body.app.feuille-actions #entete nav.outils{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:72;max-height:72vh;overflow:auto;
  padding:16px calc(12px + env(safe-area-inset-right)) 16px calc(12px + env(safe-area-inset-left));background:#211b15;border-top:1px solid rgba(226,184,102,.4);border-radius:16px 16px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.55)}
body.app.feuille-actions #entete nav.outils .bt{width:100%;min-width:0;justify-content:flex-start;gap:10px;font-size:15px}
body.app.feuille-actions #entete nav.outils .bt[hidden]{display:none}
body.app.feuille-actions #entete nav.outils .bt>span[data-t]{position:static;width:auto;height:auto;overflow:visible;clip:auto;white-space:normal;text-align:left}
body.app.feuille-actions #micro-zone,body.app.feuille-actions #zoom{display:none}
body.app #zoom{bottom:calc(160px + env(safe-area-inset-bottom))}
body.app.feuille-actions #voile-actions{display:block;position:fixed;inset:0;z-index:71;background:rgba(12,10,8,.5)}
/* T6 : notifications en haut, une à la fois ; plus de bouton chat flottant ; équipe en défilement aimanté avec un dégradé */
body.app #toasts{top:calc(64px + env(safe-area-inset-top));bottom:auto;left:8px;right:8px;align-items:stretch}
body.app #toasts .toast{width:auto;max-width:none;font-size:16px}
body.app #toasts .toast:not(:last-child){display:none}
body.app.clavier #toasts{display:none}
body.app #bt-chat{display:none!important}
body.app #equipe{scroll-snap-type:x mandatory;scroll-padding:0 8px;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent);padding-right:40px}
body.app #equipe .membre{scroll-snap-align:start}

body.app.clavier #panneau{bottom:0!important}
body.app.clavier #micro-zone,body.app.clavier #equipe{display:none}
/* T4 et T5 : la conversation en colonne, le fil prend la place, la saisie est collée en bas comme dans une messagerie */
body.app #panneau.conv-app .feuille{display:flex;flex-direction:column;overflow:hidden}
body.app #panneau.conv-app #pn-corps{display:flex;flex-direction:column;flex:1;min-height:0}
body.app #panneau.conv-app .fil{flex:1;max-height:none;min-height:0;overflow:auto;overscroll-behavior:contain;margin-bottom:0}
.conv-saisie{display:flex;flex-direction:column;gap:6px}
body.app .conv-saisie{position:sticky;bottom:0;margin:0 -16px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:#f2e8cf;border-top:1px solid rgba(92,79,63,.2)}
body.app.clavier .conv-saisie{padding-bottom:8px}
body.app .conv-saisie textarea{min-height:44px;max-height:30vh;field-sizing:content;margin:0}
body.app .conv-saisie .rangee{margin:0;flex-wrap:nowrap}
body.app .conv-saisie .rangee [data-envoyer]{margin-left:auto;min-width:96px}
/* T1 + T2 : téléphone couché (petite hauteur, doigt) : icônes seules sur une rangée qui défile, onglets en rail vertical */
@media (orientation:landscape) and (max-height:500px){
  #entete .outils{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}#entete .outils>*{flex:0 0 auto}
  #entete .outils .bt>span[data-t]{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  #entete .outils .bt,#entete .outils .bt.fort,#entete #bt-optim,#entete #bt-notifs,#entete #bt-son{padding:6px 10px;min-width:0;min-height:40px}
  body.app #onglets-app{top:0;bottom:0;right:auto;width:calc(72px + env(safe-area-inset-left));height:auto;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom) env(safe-area-inset-left);border-top:0;border-right:1px solid rgba(226,184,102,.35)}
  body.app #onglets-app button.actif::before{top:22%;bottom:22%;left:0;right:auto;width:3px;height:auto;border-radius:0 3px 3px 0}
  body.app #panneau{left:calc(72px + env(safe-area-inset-left))!important;width:auto!important;max-width:none!important;bottom:0!important}
  body.app #panneau .feuille{width:100%}
  body.app #entete{padding-left:calc(84px + env(safe-area-inset-left))}
  body.app #equipe{left:calc(80px + env(safe-area-inset-left))!important;bottom:8px!important}
  body.app #micro-zone{bottom:calc(100px + env(safe-area-inset-bottom))}
  body.app #zoom{bottom:calc(100px + env(safe-area-inset-bottom))}
  body.app #toasts{left:auto;right:calc(8px + env(safe-area-inset-right));top:calc(8px + env(safe-area-inset-top));width:min(380px,50vw)}
  body.app.feuille-actions #entete nav.outils{left:calc(72px + env(safe-area-inset-left));bottom:0;max-height:90vh}
}
/* ---------- groupe : une carte par agent (portrait, nom, %, action en cours, barre vivante, raison et temps), même DA que les étiquettes ---------- */
#equipe .membre{display:grid!important;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:10px;padding:8px 12px 8px 8px;border-radius:6px 16px 6px 16px;border-left:5px solid var(--ce,#8a8174);background:linear-gradient(180deg,rgba(40,34,27,.92),rgba(26,23,19,.9));min-width:0}
#equipe .membre .cadre-p{position:relative;flex:none;border-radius:50%;padding:3px;background:linear-gradient(135deg,var(--ce,#e2b866),#2b241c);box-shadow:0 4px 10px rgba(0,0,0,.4);line-height:0}
#equipe .membre canvas{width:54px;height:54px;border-radius:50%}
#equipe .membre .metier{position:absolute;right:-5px;bottom:-3px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--ce,#8a8174);border:2px solid #f4ecd9;box-shadow:0 2px 4px rgba(0,0,0,.4)}
#equipe .membre .metier .ic-etat{color:#fffaf0!important;width:12px;height:12px}
#equipe .membre .t{display:flex;flex-direction:column;gap:4px;min-width:0;width:100%}
#equipe .membre .l1{display:flex;align-items:baseline;gap:8px;min-width:0}
#equipe .membre .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:400 16.5px/1.15 var(--serif);color:#f1e3c3}
#equipe .membre .pc{flex:none;font:700 14px var(--sans);color:var(--pcc,#e2b866);font-variant-numeric:tabular-nums;white-space:nowrap}
#equipe .membre .act{display:flex;gap:6px;align-items:flex-start;font-size:13.5px;line-height:1.3;color:#ddd0b4;min-width:0}
#equipe .membre .act .ic-etat{margin-top:.12em}
#equipe .membre .act span{flex:1;min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
#equipe .membre .act.inconnu{color:#e08a72}
#equipe .membre .mini{display:block;width:100%;height:10px;margin-top:1px;position:relative;border-radius:3px;border:1px solid rgba(0,0,0,.5);background:#3a3128;overflow:hidden}
#equipe .membre .mini i{display:block;height:100%;width:0;background:linear-gradient(90deg,#c9953e,#7fae5e);transition:width 1s linear;border-radius:2px}
#equipe .membre .l3{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;line-height:1.25;color:#bfb196;min-width:0}
#equipe .membre .l3 span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#equipe .membre .l3 .rt{flex:none;color:#e2b866;font-variant-numeric:tabular-nums}
#equipe .membre .l3 .rt.retard{color:#e08a72}
#equipe .membre .l3 span:empty{display:none}
/* barres d'attente, de pause, de blocage et de travail continu : rayures qui défilent (jamais une barre pleine figée) */
.mini.attente i,.mini.continu i,.mini.demarre i,.mini.bloque i,.mini.libre i,.mini.fini i{width:100%!important;background-size:28px 28px!important;animation:rayures 1.4s linear infinite}
.mini.attente i{background-image:repeating-linear-gradient(-45deg,#7d6232 0 7px,#5a4524 7px 14px)!important;opacity:.95}
.mini.libre i{background-image:repeating-linear-gradient(-45deg,#a57a34 0 7px,#80602c 7px 14px)!important;opacity:.85}
.mini.continu i{background-image:repeating-linear-gradient(-45deg,#5d8f57 0 7px,#46703f 7px 14px)!important}
.mini.demarre i{background-image:repeating-linear-gradient(-45deg,#c9953e 0 7px,#9c7330 7px 14px)!important;opacity:.7}
.mini.bloque i{background-image:repeating-linear-gradient(-45deg,#b8553f 0 7px,#8e3a2a 7px 14px)!important}
.mini.fini i{background-image:repeating-linear-gradient(-45deg,#6f9a5a 0 7px,#557a45 7px 14px)!important}
@keyframes rayures{from{background-position:0 0}to{background-position:28px 0}}
/* barre en cours : un reflet passe sur la partie faite toutes les 2,6 s (la barre vit même quand le % ne change pas pendant quelques minutes) */
.mini.progres i{position:relative;overflow:hidden}
.mini.progres i::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,250,235,.55),rgba(255,255,255,0));transform:translateX(-100%);animation:reflet 2.6s ease-in-out infinite}
@keyframes reflet{0%{transform:translateX(-100%)}70%,100%{transform:translateX(260%)}}
.mini.progres.retard i::after{display:none}   /* « en retard » : la barre est figée au chiffre écrit + 8 points, plus de reflet qui la ferait croire vivante */
@media (prefers-reduced-motion:reduce){.mini i,.mini.progres i::after{animation:none!important}}
.barre-fiche{margin:6px 0}.barre-fiche .mini{display:block;width:100%;height:14px;position:relative;border-radius:5px;border:1px solid rgba(0,0,0,.35);background:#3a3128;overflow:hidden}.barre-fiche .mini i{display:block;height:100%;width:0;background:linear-gradient(90deg,#c9953e,#7fae5e);transition:width 1s linear;border-radius:4px}.barre-fiche .bf-t{display:block;font:600 12.5px/1.4 var(--sans);margin-top:3px}.barre-fiche .bf-t.retard{color:#b4532f}
html[data-theme=clair] #equipe .membre{background:rgba(255,251,242,.95)}html[data-theme=clair] #equipe .membre .n{color:#2b241c}html[data-theme=clair] #equipe .membre .pc{color:color-mix(in srgb,var(--pcc,#e2b866) 50%,#2b241c)}
html[data-theme=clair] #equipe .membre .act,html[data-theme=clair] #equipe .membre .l3{color:#4a3d2e!important}html[data-theme=clair] #equipe .membre .l3 .rt{color:#8a5b12}
body.app #equipe .membre{scroll-snap-align:start;padding:6px 10px 6px 6px;gap:8px}body.app #equipe .membre canvas{width:44px;height:44px}body.app #equipe .membre .act span{-webkit-line-clamp:1}
/* ---------- en-tête : barre d'outils sur une ligne (icônes seules quand la place manque), forfait Claude ---------- */
#entete nav.outils>.bt.ic-seul>span[data-t]{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#entete nav.outils>.bt.ic-seul{min-width:46px!important;padding:8px 11px}#entete nav.outils>.bt.fort.ic-seul{min-width:58px!important}
#entete.serre1 nav.outils{gap:6px}#entete.serre1 nav.outils>.bt{min-width:0}#entete.serre1 #bt-couper{margin-left:6px!important}
#entete.serre3 #v1 .piste,#entete.serre3 #forfait .piste{width:80px}#entete.serre3 #forfait>span:first-child,#entete.serre3 #v1>span:first-child{display:none}#entete.serre3 #horloge{font-size:14px;padding:5px 10px}#entete.serre3 #forfait small{min-width:0}
#entete.serre4 #forfait small{display:none}#entete.serre4 #v1 .piste,#entete.serre4 #forfait .piste{width:56px}
#forfait{display:flex;align-items:center;gap:10px;font:400 14px var(--serif);background:rgba(255,250,235,.05);border:1px solid var(--bord,rgba(233,210,160,.2));border-radius:999px;padding:6px 14px;color:#e8dcc2;white-space:nowrap}
#forfait[hidden]{display:none}
#forfait .piste{width:150px;height:12px;border-radius:6px;background:#3a3128;border:1px solid rgba(0,0,0,.4);overflow:hidden}
#forfait .plein{height:100%;width:0;background:linear-gradient(90deg,#c9953e,#7fae5e);transition:width .8s}
#forfait b{font:600 15px var(--sans);color:#f1d9a4;font-variant-numeric:tabular-nums}
#forfait.orange .plein{background:linear-gradient(90deg,#e2b866,#d0802a)}#forfait.orange b{color:#f0b060}
#forfait.rouge .plein{background:linear-gradient(90deg,#d8664a,#a8432e)}#forfait.rouge b{color:#ef8a6e}
#forfait small{font:400 12.5px var(--sans);color:#bfb196;font-variant-numeric:tabular-nums;border-left:1px solid var(--bord,rgba(233,210,160,.2));padding-left:10px;min-width:8.6em}
#forfait.ancien{opacity:.6}#forfait.ancien .piste,#forfait.ancien b{display:none}
@media (max-width:1400px){#forfait .piste{width:90px}}
@media (max-width:1100px){#forfait small{display:none}}
@media (max-width:900px){#forfait .piste{width:60px}#forfait>span:first-child{display:none}}
body.app #forfait small,body.app #forfait>span:first-child{display:none}body.app #forfait.ancien{display:none!important}body.app #forfait{gap:6px;padding:4px 10px}body.app #forfait .piste{width:36px}body.app #forfait b{font-size:13px}
html[data-theme=clair] #forfait{background:rgba(255,252,244,.85);color:#3b2f22}html[data-theme=clair] #forfait b{color:#8a5b12}html[data-theme=clair] #forfait small{color:#5a4a36}
/* plein écran PC : la barre de menus reste en haut, le reste se redistribue */
body.ecran-plein{overflow:hidden}
/* bandeau « qui parle » : la phrase d'un perso qui n'a pas de place pour sa bulle, avec son nom (téléphone : en bas de la scène ;
   PC : en bas à gauche, jamais jusqu'aux boutons du milieu) */
#parole{position:fixed;left:8px;right:64px;bottom:100px;z-index:14;background:#fffdf7;color:#1f1912;border-radius:11px;padding:6px 12px 8px;font:15px/1.3 var(--serif);box-shadow:0 2px 9px rgba(0,0,0,.35);border:1px solid rgba(185,133,50,.45);pointer-events:none}
#parole b{display:block;font:700 13.5px var(--serif);color:#8a5a1c;letter-spacing:.03em}
#parole[hidden]{display:none}
#parole .txt{display:block;max-height:calc(1.3em * 4);overflow:hidden}#parole .reste{visibility:hidden}
@media (min-width:901px){#parole .txt{max-height:calc(1.3em * 6)}}
@media (min-width:901px){#parole{left:calc(var(--larg-groupe,0px) + 14px);right:auto;bottom:14px;width:max-content;max-width:min(440px,calc(50vw - var(--larg-groupe,0px) - 14px - 104px * var(--k,1)));font-size:16.5px;padding:8px 14px 10px}#parole b{font-size:14.5px}}
/* trop peu de place à gauche du micro (fenêtre 1280 × 800) : le bandeau passe au-dessus du micro et s'élargit
   comme dans le studio jumeau (moitié de la scène moins 64 px, 440 px au plus) */
@media (min-width:901px){body.parole-haute #parole{bottom:var(--bas-parole,120px);max-width:min(440px,calc((100vw - var(--larg-groupe,0px)) / 2 - 64px))}}
/* téléphone : le micro, le zoom et le bandeau restent au-dessus des cartes du groupe (leur hauteur est mesurée : --bas-equipe) */
body.app #micro-zone,body.app #zoom{bottom:calc(80px + var(--bas-equipe,122px) + env(safe-area-inset-bottom))!important}
body.app #parole{bottom:calc(156px + var(--bas-equipe,122px) + env(safe-area-inset-bottom))}
/* ===== Paquet 2 : conversation façon Claude Code, pièces jointes, Modèles, Auditeur ===== */
/* fenêtres au grand écran : #panneau est agrandi (zoom: var(--k)) ; leurs hauteurs et largeurs en vh / vw sont divisées par --k
   pour que la fenêtre reste entière et centrée dans l'écran (avant : 86vh × 1,32 dépassait en haut et en bas en 2560 × 1440) */
body:not(.app) #panneau .feuille{max-height:calc(86vh / var(--k));max-width:calc(94vw / var(--k))}
body:not(.app) #panneau.large .feuille{max-height:calc(92vh / var(--k));max-width:calc(96vw / var(--k))}
/* Conversation au PC : fenêtre centrée plus large, fil qui défile, zone de saisie collée en bas */
body:not(.app) #panneau.conv-app .feuille{width:min(920px,calc(94vw / var(--k)));height:min(calc(88vh / var(--k)),1000px);max-height:none;display:flex;flex-direction:column;overflow:hidden;padding-bottom:16px}
body:not(.app) #panneau.conv-app #pn-corps{display:flex;flex-direction:column;flex:1;min-height:0}
body:not(.app) #panneau.conv-app .fil{flex:1 1 auto;max-height:none;min-height:0;overflow:auto;margin:6px 0 0;padding:6px 6px 14px;border-bottom:0}
body:not(.app) #panneau.conv-app .fil .msg{max-width:82%}
#panneau.conv-app .conv-aide{margin:2px 0 4px}
body:not(.app) #panneau.conv-app .feuille>.x{position:absolute;top:14px;right:16px;margin:0;float:none;z-index:3}body:not(.app) #panneau.conv-app h2{padding-right:44px}
.conv-saisie{position:relative;flex:none}
.cc-boite{position:relative;border:1.5px solid rgba(92,79,63,.35);border-radius:16px;background:#fffdf7;box-shadow:0 6px 18px rgba(80,60,30,.14);padding:8px 10px;transition:border-color .15s,box-shadow .15s}
.cc-boite:focus-within{border-color:#c9953e;box-shadow:0 0 0 3px rgba(201,149,62,.22),0 6px 18px rgba(80,60,30,.14)}
.cc-boite textarea{border:0!important;background:transparent!important;box-shadow:none!important;outline:none;width:100%;min-height:52px;max-height:34vh;resize:none;padding:4px;margin:0;font:inherit;field-sizing:content;color:var(--encre)}
.cc-barre{display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:nowrap}
.cc-barre .cc-ic{width:38px;height:38px;min-height:38px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid rgba(92,79,63,.28);background:#fbf5e6;color:#5c4f3f;cursor:pointer;padding:0;flex:none}
.cc-barre .cc-ic:hover{background:#f3e6c6;color:#2b241c}.cc-barre .cc-ic svg{width:19px;height:19px}
.cc-barre .micro{border-radius:999px}
.cc-barre [data-envoyer]{margin-left:auto;min-width:104px;border-radius:999px}
.cc-barre [data-res]{font-size:.85em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cc-photo{display:none!important}body.app .cc-photo{display:inline-grid!important}@media (pointer:coarse){.cc-photo{display:inline-grid!important}}
.cc-aide{font-size:.78em;color:var(--encre3);margin:6px 4px 0}body.app .cc-aide{display:none}
#cc-pj{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 6px}#cc-pj:empty{display:none}
.pj{position:relative;display:flex;align-items:center;gap:8px;max-width:240px;padding:5px 30px 5px 5px;border:1px solid rgba(92,79,63,.28);border-radius:10px;background:#f6eedb;font-size:.82em;line-height:1.25}
.pj img{width:52px;height:52px;object-fit:cover;border-radius:7px;flex:none;background:#e9dcbd}
.pj .pj-ic{width:52px;height:52px;border-radius:7px;flex:none;display:grid;place-items:center;background:#e9dcbd;color:#5c4f3f;font:700 11px var(--sans);letter-spacing:.04em}
.pj b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}.pj small{color:var(--encre3)}
.pj .pj-x{position:absolute;top:4px;right:4px;width:22px;height:22px;min-height:22px;border-radius:50%;border:0;background:rgba(43,36,28,.75);color:#fff;font-size:14px;line-height:22px;padding:0;cursor:pointer}
@media (pointer:coarse){.pj .pj-x{width:32px;height:32px;min-height:32px;line-height:32px;top:-6px;right:-6px}.pj{padding-right:30px}}
.pj.envoi::after{content:"";position:absolute;left:5px;bottom:5px;width:52px;height:3px;border-radius:2px;background:linear-gradient(90deg,#c9953e 40%,transparent 40%) 0 0/200% 100%;animation:pjEnvoi 1s linear infinite}
@keyframes pjEnvoi{to{background-position:-100% 0}}
.pj.erreur{border-color:#b23b2a;background:#f8e3dc}.pj.erreur small{color:#8e2f21}
.cc-depot{position:absolute;inset:0;z-index:5;display:none;place-items:center;border:3px dashed #c9953e;border-radius:12px;background:rgba(251,245,230,.92);font:italic 400 22px var(--serif);color:#7a5a2a;pointer-events:none}
#panneau.depot .cc-depot{display:grid}
.msg .pj-envoyees{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;white-space:normal}
.msg .pj-envoyees a,.msg .pj-envoyees span{display:inline-flex;align-items:center;gap:6px;padding:3px 8px 3px 3px;border-radius:8px;background:rgba(255,255,255,.6);border:1px solid rgba(92,79,63,.22);font-size:.82em;color:inherit;text-decoration:none;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.msg .pj-envoyees img{width:44px;height:44px;object-fit:cover;border-radius:6px;flex:none}
.msg .pj-envoyees a.pj-manque{opacity:.8}.msg .pj-envoyees .pj-manque-l{display:inline-block;font-size:.9em;color:#9a3b2a;margin-left:2px}.msg .pj-envoyees .pj-ic-manque.petit{width:auto;height:auto;padding:2px 5px;background:none;border:0}.msg .pj-envoyees .pj-ic-manque{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:6px;background:rgba(92,79,63,.12);flex:none}
body.app .conv-saisie .cc-boite{border-radius:14px}
/* Onglet Modèles */
body:not(.app) #panneau:has(.mod-table) .feuille,body:not(.app) #panneau:has(.aud-per) .feuille{width:min(980px,calc(94vw / var(--k)))}
body:not(.app) #panneau:has(.eq-liste) .feuille{width:min(1060px,calc(94vw / var(--k)))}
.mod-table{width:100%;border-collapse:collapse;margin:6px 0 4px;font-size:.95em}
.mod-table th{font:600 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--encre2);text-align:left;padding:6px;border-bottom:1px solid rgba(92,79,63,.3)}
.mod-table td{padding:8px 6px;border-bottom:1px dotted rgba(92,79,63,.3);vertical-align:middle}
.mod-table td.qui b{display:block}.mod-table td.qui small{display:block;color:var(--encre3);line-height:1.3;max-width:330px}
.mod-table select{border:1px solid rgba(92,79,63,.3);background:#fffdf6;border-radius:8px;padding:5px 6px;color:var(--encre);font:inherit;font-size:.92em;max-width:170px}
.mod-table .src{font-size:.75em;color:var(--encre3);display:block;margin-top:2px}
.mod-table tr.change td{background:rgba(201,149,62,.1)}
.mod-encart{border-left:3px solid #c9953e;background:rgba(201,149,62,.1);padding:8px 12px;border-radius:0 10px 10px 0;margin:10px 0;font-size:.92em}
.mod-ctrl-l{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:.92em}.mod-ctrl-l input{width:18px;height:18px}
.mod-journal li small{color:var(--encre3)}
@media (max-width:760px){.mod-table thead{display:none}.mod-table tr{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 0;border-bottom:1px dotted rgba(92,79,63,.3)}.mod-table td{border:0;padding:2px 0}.mod-table td.qui,.mod-table td.act{grid-column:1/-1}.mod-table select{max-width:none;width:100%}}
@media (pointer:coarse),(max-width:760px){.mod-table select{min-height:44px;font-size:16px}.mod-table td.act .petit{min-height:44px;min-width:96px;display:inline-flex;align-items:center;justify-content:center}.mod-ctrl-l{min-height:44px}.mod-ctrl-l input{width:24px;height:24px}}
.bts.petit,.btp.petit{padding:5px 12px;font-size:.92em}
/* Vue Audit */
.aud-carte{border:1px solid rgba(92,79,63,.28);border-radius:12px;padding:10px 14px;margin:10px 0;background:rgba(255,253,246,.6)}
.aud-carte h4{margin:0 0 4px;font:italic 400 18px var(--serif)}
.aud-grav{display:inline-block;min-width:58px;text-align:center;font:700 10.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 8px;margin-right:6px;color:#fff}
.aud-grav.grave{background:#b23b2a}.aud-grav.moyen{background:#c07b1e}.aud-grav.faible{background:#5f7d5c}
.aud-constat{padding:6px 0;border-top:1px dotted rgba(92,79,63,.25)}.aud-constat p{margin:2px 0 0;font-size:.92em}
.aud-suite{font-size:.8em;color:var(--encre2);font-style:italic}
.aud-per{display:flex;flex-wrap:wrap;gap:8px 16px;margin:6px 0 10px}.aud-per label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;min-height:32px}
.aud-per input{width:18px;height:18px}

/* AN3 (T15) : niveau sonore de la dictée : anneau qui grandit avec la voix et petite barre sous le bouton */
.micro.actif,#gros-micro.actif{box-shadow:0 0 0 calc(var(--niv-micro,0) * 9px) rgba(194,83,60,.38)!important;transition:box-shadow .08s linear}
.micro.actif::before{content:"";position:absolute;left:9px;right:9px;bottom:-8px;height:3px;border-radius:2px;pointer-events:none;background:linear-gradient(90deg,#e0805f calc(var(--niv-micro,0) * 100%),rgba(120,100,80,.25) 0)}
@media (prefers-reduced-motion:reduce){.micro.actif,#gros-micro.actif{transition:none}}
/* S24 : en mode accueil (questionnaire, pas d'équipe ni de roadmap), la barre ne garde que Réglages, Son, Plein écran, Conversation et la voix */
html[data-accueil] .outils .bt:not(#bt-reglages):not(#bt-son):not(#bt-plein):not(#bt-conv):not(#bt-assistant):not(#bt-plus-pc) { display: none !important; }
</style>

    <button type="button" class="bt" id="bt-ensemble"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg><span data-t="ensemble">Vue d’ensemble</span></button>

    <button type="button" class="bt" id="bt-optim"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/><circle cx="8" cy="8" r="2.5"/></svg><span data-t="optimiser">Optimiser</span><b class="pastille" id="nb-optim"></b></button>

  const zone = $('#toasts'), vivants = [...zone.children].filter(x => !x.classList.contains('part'));

  const r = await poster('/api/recruter', { nom: tc.poste, nom_affiche: nom.slice(0, 40), role: (LANGUE === 'fr' ? 'Poste « ' : 'Trade “') + nom + (LANGUE === 'fr' ? ' » : tâches de la roadmap' : '”: roadmap tasks'),
    mission: lot.map(x => `- ${x.id} : ${x.titre}${x.critere ? ' (' + x.critere + ')' : ''}`).join('\n').slice(0, 3900), auto: true, apparence: 'aucune', couleur: '#' + (hashStr(tc.poste) & 0xffffff).toString(16).padStart(6, '0') });
  FICHES_RECRUES[r.fiche.nom] = r.fiche; if (!RECRUES.some(x => x.nom === r.fiche.nom)) RECRUES.push(r.fiche);

}

// ====================================================================== fin de tâche : le personnage va voir l'assistant
// etat.json (studio_etat.py) dit « fin_de_tache » après un vrai calme. Le personnage quitte son bureau et attend près de
// l'assistant ; sa fiche propose « Lui confier une tâche », « Trouve-toi une tâche », « Laisser en pause ». Sans réponse en
// 2 min ET si l'attribution automatique est activée (coupée par défaut), l'assistant lui confie la tâche choisie par la même
// règle que « Trouve-toi une tâche » : tâche prête de son métier, puis préparation sans moteur d'une tâche de son métier,
// seulement ensuite une tâche sans moteur hors de son métier. Garde-fous (revérifiés par le serveur) : une attribution
// automatique en attente par poste, 4 par heure.
const EXCLUE_RE = /\b(sorti|sortie|écart|ecart|abandonn|hors v1|hors version|remplac|report|retir|dropped|removed|postponed|out of scope|replaced)/i;
// S37 : l'alimentation (studio_etat.py → automatismes.py) tient la fin de tâche, la tyrannie et l'embauche, même sans onglet ouvert.
// Alors la page ne fait plus qu'afficher ; avec un ancien serveur (pas de « automatismes.serveur »), l'onglet meneur agit comme avant.
const autosServeur = () => !!(etatFrais() && ETAT.automatismes && ETAT.automatismes.serveur);
const AUTOS_SRV = () => (ETAT && ETAT.automatismes) || {};
const FinTache = (() => {
  const FIN = {}, traites = new Set(LS.get('fins_traitees', [])), DELAI = 120000;
  // C (DA 13/11) : demandes mises de côté par l'assistant (clé de fin de tâche → heure), file de ceux qui attendent d'être reçus
  const COTE = new Map(Object.entries(LS.get('fins_cote', {}))), RECOIT = []; let recoitEnCours = null;
  const garder = () => LS.set('fins_traitees', [...traites].slice(-200));
  function clore(pid) { if (FIN[pid]) { traites.add(FIN[pid].cle); delete FIN[pid]; garder(); } }
  function verifier() {
    if (!ONGLET.meneur || CONF.mode !== 'travail' || !etatFrais()) return;
    const ids = new Set(postes().map(p => p.id));
    for (const ep of ETAT.postes) {
      if (!ep || !ids.has(ep.id)) continue;
      const cle = ep.id + ':' + ep.depuis;
      if (ep.fin_de_tache && ep.etat === 'disponible' && !FIN[ep.id] && !traites.has(cle)) {
        const fini = String(ep.fini || ep.texte || '').slice(0, 120), p = postes().find(x => x.id === ep.id);
        FIN[ep.id] = { debut: Date.now(), cle, fini };
        const qf = (+ep.depuis || 0) * 1000;
        if (!notifVieille(qf)) Bureau.dire(ep.id, `${t('jai_fini')}${fini ? ' « ' + fini.slice(0, 60) + ' »' : ''}. ${t('quelque_chose')}`, 10);
        Notifs.ajouter({ id: 'fin-' + cle, type: 'decision', titre: nomPoste(p) + ' · ' + t('fin_tache'), ligne: fini, cible: { poste: ep.id }, quand: qf });
      } else if (FIN[ep.id] && (!ep.fin_de_tache || ep.etat !== 'disponible')) clore(ep.id);
    }
  }
  const exclue = tc => ['retiree', 'hors_v1', 'abandonnee', 'reportee', 'remplacee'].some(k => tc[k] === true) || EXCLUE_RE.test(`${tc.note || ''} ${tc.etat || ''}`);
  // Candidats dans l'ordre de la règle (même métier, préparation, hors métier), sans ce qui est déjà confié ou en cours.
  function candidats(pid) {
    const deja = new Set(LS.get('taches_confiees', []));
    for (const ep of (ETAT && Array.isArray(ETAT.postes) ? ETAT.postes : [])) for (const dm of (ep && Array.isArray(ep.demandes) ? ep.demandes : [])) if (dm && dm.tache_id) deja.add(dm.tache_id);
    const pp = postes().find(x => x.id === pid) || {}, ms = Array.isArray(pp.metiers) ? pp.metiers : [];
    const libre = tc => tc && tc.id && !deja.has(tc.id), pour = tc => tc.poste === pid || (Array.isArray(tc.pour) && tc.pour.includes(pid)) || (!!tc.metier && ms.includes(tc.metier));
    const crit = tc => tc.critere || '?', out = [], vus = new Set(), pousser = (tc, genre, mission, titre) => { if (vus.has(tc.id)) return; vus.add(tc.id); out.push({ tache_id: tc.id, genre, mission, titre }); };
    TACHES.filter(tc => pour(tc) && tc.statut === 'a_faire' && libre(tc)).forEach(tc => pousser(tc, 'metier', tf('mission_tache', { id: tc.id, titre: tc.titre, critere: crit(tc) }), `${tc.id} · ${tc.titre}`));
    const rm = window.Roadmap && Roadmap.etat && Roadmap.etat();
    if (rm) for (const j of rm.jalons) for (const tc of j.taches) if (tc && tc.poste === pid && tc.statut === 'a_faire' && libre(tc) && !exclue(tc) && !TACHES.some(x => x.id === tc.id))
      pousser(tc, 'preparation', tf('mission_prep', { id: tc.id, titre: tc.titre || '', critere: crit(tc) }), `${t('preparer')} : ${tc.id} · ${tc.titre || ''}`);
    TACHES.filter(tc => !pour(tc) && tc.statut === 'a_faire' && tc.sans_moteur && tc.origine !== 'backlog' && libre(tc)).forEach(tc => pousser(tc, 'hors', tf('mission_tache', { id: tc.id, titre: tc.titre, critere: crit(tc) }), `${tc.id} · ${tc.titre} (${t('hors_metier')})`));
    return out.slice(0, 12);
  }
  async function confier(pid, c, origine) {
    const r = await poster('/api/confier', { agent: pid, mission: c.mission.slice(0, 4000), titre: c.titre.slice(0, 200), tache_id: c.tache_id, origine });
    LS.set('taches_confiees', LS.get('taches_confiees', []).concat(c.tache_id).slice(-300));
    clore(pid); Son.clic(); Bureau.dire(pid, t('confiee') + ' : ' + c.titre, 6);
    const p = postes().find(x => x.id === pid);
    Notifs.ajouter({ id: 'conf-' + pid + '-' + Date.now(), type: 'fait', titre: (origine.startsWith('auto:') ? t('confiee_auto') + ' ' : t('confiee') + ' · ') + (p ? nomPoste(p) : pid), ligne: c.titre, cible: { poste: pid } }, origine.startsWith('auto:'));
    return r;
  }
  function encadre(p) {
    const f = FIN[p.id];
    return `<div class="encadre fin" data-fin="${esc(p.id)}"><b>${f ? iconeEtat('fin') + ' ' + esc(t('fin_tache')) : iconeEtat('disponible') + ' ' + esc(t('libre_titre'))}</b>
      ${f ? `<p style="margin:4px 0">${esc(t('jai_fini'))}${f.fini ? ' « ' + esc(f.fini) + ' »' : ''}. ${esc(t('quelque_chose'))}</p>` : ''}
      <div class="rangee choix"><button type="button" class="btp" data-ft="confier">${esc(t('confier'))}</button><button type="button" class="bts" data-ft="trouve">${esc(t('trouve_toi'))}</button><button type="button" class="bts" data-ft="pause">${esc(t('pause'))}</button></div>
      ${f ? `<p class="discret" data-compte></p>` : ''}<div class="liste-dec" data-liste></div><p class="discret" data-ft-res></p></div>`;
  }
  function lier(el, p) {
    const z = el.querySelector('[data-fin]'); if (!z) return;
    const res = z.querySelector('[data-ft-res]'), essai = async (c, origine) => { try { await confier(p.id, c, origine); Panneau.fermer(); } catch (e) { res.textContent = e.message; } };
    z.querySelector('[data-ft=confier]').onclick = () => {
      const l = candidats(p.id), zl = z.querySelector('[data-liste]');
      zl.innerHTML = l.length ? l.map((c, i) => `<button type="button" class="bts" data-i="${i}">${esc(c.titre)}</button>`).join('') : `<p class="discret">${esc(t('aucune_tache'))}</p>`;
      zl.querySelectorAll('[data-i]').forEach(b => b.onclick = () => essai(l[+b.dataset.i], 'tache:' + l[+b.dataset.i].tache_id));
    };
    z.querySelector('[data-ft=trouve]').onclick = () => { const c = candidats(p.id)[0]; if (c) essai(c, 'tache:' + c.tache_id); else res.textContent = t('aucune_tache'); };
    z.querySelector('[data-ft=pause]').onclick = () => { if (FIN[p.id]) clore(p.id); else { const ep = etatFrais() && ETAT.postes.find(x => x && x.id === p.id); if (ep) { traites.add(p.id + ':' + ep.depuis); garder(); } } Panneau.fermer(); };
    tic();
  }
  function tic() {
    const n = Date.now();
    for (const pid of Object.keys(FIN)) {
      const f = FIN[pid], delai = Tyrannie.active() ? 30000 : DELAI; if (autosServeur() || f.tente || !auto('attribution_auto') || machineSaturee() || n - f.debut < delai) continue;
      f.tente = true; const c = candidats(pid).find(x => { const tc = TACHES.find(y => y.id === x.tache_id) || {}; return tc.sans_moteur !== false && tc.moteur !== true; });   // S31 : jamais une tâche moteur d'office
      if (!c) { clore(pid); continue; }
      confier(pid, c, 'auto:fin-de-tache').catch(e => { erreur('attribution auto', e); Notifs.ajouter({ id: 'auto-refus-' + pid + '-' + n, type: 'info', titre: t('fin_tache'), ligne: e.message, cible: { poste: pid } }, true); clore(pid); });
    }
    document.querySelectorAll('[data-fin]').forEach(z => {
      const f = FIN[z.dataset.fin], c = z.querySelector('[data-compte]'); if (!f || !c) return;
      const s = Math.max(0, Math.ceil(((Tyrannie.active() ? 30000 : DELAI) - (n - f.debut)) / 1000));
      c.textContent = auto('attribution_auto') ? `${t('auto_dans')} ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` : t('auto_coupee');
    });
  }
  setInterval(tic, 1000);
  const coteDe = pid => !!(FIN[pid] && COTE.has(FIN[pid].cle));
  const en = () => LANGUE === 'en';
  function arrive(pid) { const f = FIN[pid]; if (!f || COTE.has(f.cle) || RECOIT.includes(pid) || (recoitEnCours && recoitEnCours.pid === pid)) return; RECOIT.push(pid); }
  function ticRecoit() {   // l'assistant reçoit un agent à la fois : pause, note, renvoi au poste
    const n = Date.now();
    if (!recoitEnCours && RECOIT.length) { const pid = RECOIT.shift(); if (FIN[pid]) recoitEnCours = { pid, t0: n }; }
    const r = recoitEnCours; if (!r) return; const f = FIN[r.pid]; if (!f) { recoitEnCours = null; return; }
    const p = postes().find(x => x.id === r.pid), nom = p ? nomPoste(p) : r.pid, k = n - r.t0;
    if (!r.d1 && k > 700) { r.d1 = true; Bureau.dire('assistant', en() ? `Let me pause what I'm doing. ${nom}, I'm noting your request for later: back to your desk, I'll call you.` : `Je mets ce que je fais en pause. ${nom}, je note ta demande pour plus tard : retourne à ton poste, je te fais signe.`, 6); try { Son.clic(); } catch (e) { /* rien */ } }
    if (!r.d2 && k > 4600) { r.d2 = true; Bureau.dire(r.pid, en() ? 'Sure, heading back.' : 'Ça marche, j’y retourne.', 4); }
    if (k > 6800) { COTE.set(f.cle, n); LS.set('fins_cote', Object.fromEntries([...COTE].slice(-80))); recoitEnCours = null; }
  }
  setInterval(ticRecoit, 250);
  function plusTardHtml() {
    const l = Object.keys(FIN).map(pid => ({ pid, f: FIN[pid], m: COTE.get(FIN[pid].cle) || 0 })).sort((a, b) => (a.m || 9e15) - (b.m || 9e15));
    const hh = ms => new Date(ms).toLocaleTimeString(en() ? 'en-GB' : 'fr-FR', { hour: '2-digit', minute: '2-digit' });

// ---------------- pièces jointes (trombone, glisser-déposer, Ctrl+V, appareil photo) : envoyées au serveur dès l'ajout (brouillon),
// aperçu avant envoi, retrait possible ; à l'envoi, le serveur les range dans .studio/demandes_vocales/pieces/<id du message>/.
const PJ = (() => {
  const EXT = ['png', 'jpg', 'jpeg', 'webp', 'gif', 'bmp', 'heic', 'pdf', 'txt', 'md', 'json', 'log', 'csv', 'yaml', 'yml', 'ini', 'xml', 'zip', 'glb', 'gltf', 'fbx', 'obj', 'mp3', 'wav', 'ogg', 'm4a', 'mp4', 'webm', 'mov'];
  const MAX = 20 * 1024 * 1024, MAX_N = 10, S = { brouillon: null, liste: [] };
  const image = nom => /\.(png|jpe?g|webp|gif)$/i.test(nom || '');
  const taille = n => n < 1024 ? n + (LANGUE === 'fr' ? ' o' : ' B') : n < 1048576 ? Math.round(n / 1024) + (LANGUE === 'fr' ? ' Ko' : ' KB') : (n / 1048576).toFixed(1).replace('.', LANGUE === 'fr' ? ',' : '.') + (LANGUE === 'fr' ? ' Mo' : ' MB');
  function brouillon() { if (!S.brouillon) S.brouillon = Array.from(crypto.getRandomValues(new Uint8Array(10)), b => b.toString(16).padStart(2, '0')).join(''); return S.brouillon; }
  function rendre() {
    const z = $('#cc-pj'); if (!z) return;
    z.innerHTML = S.liste.map(x => `<div class="pj ${x.etat}" title="${esc(x.nom)}">${x.url ? `<img src="${esc(x.url)}" alt="">` : `<span class="pj-ic">${esc((x.nom.split('.').pop() || '').toUpperCase().slice(0, 4))}</span>`}<span><b>${esc(x.nom)}</b><small>${x.etat === 'erreur' ? esc(x.err || t('pj_refuse')) : x.etat === 'envoi' ? esc(t('pj_envoi')) : esc(taille(x.taille))}</small></span><button type="button" class="pj-x" data-pj-x="${esc(x.cle)}" aria-label="${esc(t('pj_retirer') + ' ' + x.nom)}" title="${esc(t('pj_retirer'))}">×</button></div>`).join('');
    z.querySelectorAll('[data-pj-x]').forEach(b => b.onclick = () => retirer(b.dataset.pjX));
    const b = $('#panneau .conv-saisie [data-envoyer]'); if (b) { const enCours = S.liste.some(x => x.etat === 'envoi'); b.disabled = enCours; b.textContent = enCours ? t('pj_pieces') : t('envoyer'); }
    const fil = $('#panneau [data-fil]'); if (fil && fil.scrollHeight - fil.scrollTop - fil.clientHeight < 240) requestAnimationFrame(() => { fil.scrollTop = fil.scrollHeight; });   // l'aperçu grandit : le dernier message reste en vue
  }
  function ajouter(fichiers) {
    for (const f of fichiers) {
      if (!f) continue;
      if (S.liste.length >= MAX_N) { toast(`<b>${esc(tf('pj_max', { n: MAX_N }))}</b> ${esc(t('pj_max_l'))}`, { erreur: true }); break; }
      let nom = f.name || '';
      if (!nom || /^image\.(png|jpe?g|gif|webp)$/i.test(nom)) {        // capture collée (Ctrl+V) : nom daté
        const ext = ((f.type || '').split('/')[1] || 'png').replace('jpeg', 'jpg'), d = new Date(), p2 = v => String(v).padStart(2, '0');
        nom = `${t('capture')}-${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}-${p2(d.getHours())}${p2(d.getMinutes())}${p2(d.getSeconds())}.${ext}`;
      }
      const ext = (nom.split('.').pop() || '').toLowerCase();
      const x = { cle: Math.random().toString(36).slice(2), nom, taille: f.size, url: image(nom) ? URL.createObjectURL(f) : '', etat: 'envoi' };
      if (!EXT.includes(ext)) { x.etat = 'erreur'; x.err = t('pj_type'); } else if (f.size > MAX) { x.etat = 'erreur'; x.err = t('pj_gros'); } else if (!f.size) { x.etat = 'erreur'; x.err = t('pj_vide'); }
      S.liste.push(x); rendre();
      if (x.etat !== 'envoi') continue;
      if (ESSAI_SANS_ENVOI()) { x.etat = 'ok'; x.serveur = nom; rendre(); continue; }
      fetch('/api/piece?brouillon=' + brouillon() + '&nom=' + encodeURIComponent(nom), { method: 'POST', headers: { 'Content-Type': f.type || 'application/octet-stream' }, body: f })
        .then(async r => { let j = null; try { j = await r.json(); } catch (e) { /* rien */ } if (!r.ok || !j || !j.ok) throw new Error((j && j.erreur) || t('pj_refuse') + ' (' + r.status + ')'); return j; })
        .then(j => { x.etat = 'ok'; x.serveur = j.nom; }).catch(e => { x.etat = 'erreur'; x.err = e.message; }).finally(rendre);
    }
  }
  function retirer(cle) {
    const i = S.liste.findIndex(x => x.cle === cle); if (i < 0) return; const x = S.liste.splice(i, 1)[0];
    if (x.url) URL.revokeObjectURL(x.url);

  }
  function purgerErreurs() { for (const x of S.liste) if (x.etat === 'erreur' && x.url) URL.revokeObjectURL(x.url); S.liste = S.liste.filter(x => x.etat !== 'erreur'); rendre(); }
  function vider() { for (const x of S.liste) if (x.url) URL.revokeObjectURL(x.url); S.liste = []; S.brouillon = null; rendre(); }
  return { ajouter, retirer, rendre, purgerErreurs, vider, brouillon, image, pretes: () => S.liste.filter(x => x.etat === 'ok'), enCours: () => S.liste.some(x => x.etat === 'envoi'), liste: () => S.liste.slice() };
})();
